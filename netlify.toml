[build]
  publish = "."
  command = ""
  # non pubblicare se sono cambiati solo widget.js o le funzioni Supabase (il widget si scarica da GitHub):
  # ogni deploy di produzione consuma crediti Netlify
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)widget.js' ':(exclude)supabase'"
