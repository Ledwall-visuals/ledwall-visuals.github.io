<title>Gestionale Ledwall – Inventario & Eventi</title>
<style id="css">
:root{--bg:#0f1115;--panel:#181b22;--panel2:#20242d;--line:#2c313c;--txt:#e8eaef;--mut:#9aa1ad;--acc:#4f8cff;--ok:#2fbf71;--warn:#f0a020;--bad:#e5484d}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt);font-size:15px}
header{padding-top:max(12px,env(safe-area-inset-top))!important;display:flex;align-items:center;gap:16px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header h1{font-size:18px;margin:0}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{background:transparent;border:1px solid var(--line);color:var(--txt);padding:7px 14px;border-radius:8px;cursor:pointer}
nav button.on{background:var(--acc);border-color:var(--acc)}
main{max-width:1200px;margin:0 auto;padding:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.card h2{margin:0 0 12px;font-size:17px}
.card h3{margin:14px 0 8px;font-size:15px;color:var(--mut)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--mut);font-weight:500;font-size:13px}
input,select,textarea{background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:7px 9px;border-radius:7px;font:inherit;width:100%}
textarea{min-height:60px}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.btn{background:var(--acc);border:0;color:#fff;padding:8px 14px;border-radius:8px;cursor:pointer;font:inherit}
.btn.sec{background:var(--panel2);border:1px solid var(--line)}
.btn.bad{background:var(--bad);color:#fff}
.btn.sm{padding:4px 9px;font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;background:var(--panel2);border:1px solid var(--line)}
.ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)}
.tag.ok{border-color:var(--ok)} .tag.bad{border-color:var(--bad)} .tag.warn{border-color:var(--warn)}
.mut{color:var(--mut);font-size:13px}
.kpi{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:10px 0}
.kpi div{background:var(--panel2);border-radius:10px;padding:10px}
.kpi b{display:block;font-size:20px}
.kpi span{color:var(--mut);font-size:12px}
.screen{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.preview{display:grid;gap:2px;margin-top:10px;max-width:100%;overflow:auto}
.pmbox{margin-top:12px}.pm{display:block;max-width:100%;height:auto;margin:0 auto;border-radius:10px;background:#000}
.preview i{display:block;background:#2a4f8f;border-radius:2px}
.evlist .ev{display:flex;gap:12px;align-items:center;padding:10px;border-bottom:1px solid var(--line);cursor:pointer}
.evlist .ev:hover{background:var(--panel2)}
.check td:first-child{width:30px}
.check input{width:18px;height:18px}
#saveSt{font-size:12px;color:var(--mut)}
#dlg{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
#dlg>div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;max-width:380px;width:100%}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:10px 16px;border-radius:10px;display:none;z-index:30}
#login{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:40;padding:20px}
#login form{max-width:360px;width:100%}
#login input{margin-bottom:10px}
.pres{position:absolute;top:-6px;right:-4px;min-width:22px;height:22px;border-radius:11px;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid var(--panel);z-index:3;pointer-events:none}
.hasPres{position:relative}
.presOn{outline:2px solid var(--pc);outline-offset:1px}
.av{display:inline-flex;width:26px;height:26px;border-radius:13px;color:#fff;font-size:11px;font-weight:700;align-items:center;justify-content:center;margin-left:-6px;border:2px solid var(--panel)}
#online{display:flex;padding-left:6px}
.by{font-size:11px;color:var(--mut);margin-top:4px}
.log{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.log .av{margin:0;flex:none}
.dav{position:relative;display:inline-flex;width:24px;height:24px;border-radius:12px;color:#fff;font-size:10px;font-weight:700;align-items:center;justify-content:center;margin:2px 2px 0 0}
.dav i{position:absolute;right:-5px;bottom:-4px;font-style:normal;font-size:9px}
.dav.me{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ok)}
.dav.blk{opacity:.6;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--bad)}.dav.blk::after{content:'🚫';position:absolute;left:-7px;top:-8px;font-size:12px;opacity:1}
.calcell{background:var(--panel2);border-radius:6px;min-height:64px;padding:4px;font-size:12px}
.calcell.today{outline:2px solid var(--acc)}
.task{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.task input[type=checkbox]{width:20px;height:20px;flex:none}
.task.fatto .tt{text-decoration:line-through;color:var(--mut)}
@media(max-width:600px){main{padding:10px}.calcell{min-height:56px;padding:3px}.dav{width:20px;height:20px;font-size:9px}}
.done td{text-decoration:line-through;color:var(--mut)}
@media print{
  header,nav,.noprint{display:none!important}
  body{background:#fff;color:#000}
  .card{border:1px solid #999;background:#fff}
  .screen,.kpi div{background:#f3f3f3}
  input,select,textarea{background:#fff;color:#000;border:1px solid #999}
}
.ro{width:100%;border-collapse:collapse}.ro td{padding:9px 4px;border-top:1px solid #ffffff14;vertical-align:top}
.dategrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.dategrid>div{min-width:0}
.dategrid input[type=date]{-webkit-appearance:none;appearance:none;width:100%;min-width:0;box-sizing:border-box;display:block;text-align:left;height:44px}
/* ===== Stile Apple (iOS dark, colori di sistema) ===== */
:root{--bg:#000;--panel:#1c1c1e;--panel2:#2c2c2e;--panel3:#3a3a3c;--line:#38383a;--txt:#fff;--mut:#8e8e93;--acc:#0a84ff;--ok:#30d158;--warn:#ff9f0a;--bad:#ff453a;--r:14px}
html,body{overflow-x:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;font-size:17px;letter-spacing:-.02em;background:var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
header{background:#000000b8;-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--line);padding:8px 16px;gap:10px;flex-wrap:nowrap}
header h1{font-size:17px;font-weight:600;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}

header h1 .logo i{background:#fff;border-radius:1px}
#saveSt{font-size:12px;color:var(--mut);white-space:nowrap}
#logout{display:none!important}
#pwbtn{width:32px;height:32px;border-radius:16px;padding:0;border:0;background:var(--panel3);color:#fff;font-size:13px;font-weight:600;flex:none}
/* tab bar */
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:space-around;flex-wrap:nowrap;gap:0;background:#121212c7;-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;max-width:110px;border:0;background:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;font-size:10px;font-weight:500;letter-spacing:0;padding:4px 0;border-radius:0;cursor:pointer}
nav button svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--acc);background:none}
main{max-width:980px;padding:8px 16px calc(100px + env(safe-area-inset-bottom))}
@media(min-width:900px){nav{position:sticky;top:48px;bottom:auto;justify-content:center;gap:4px;border-top:0;border-bottom:.5px solid var(--line);padding:6px}nav button{flex:none;flex-direction:row;font-size:14px;gap:6px;padding:6px 14px;border-radius:8px;max-width:none}nav button svg{width:18px;height:18px}nav button.on{background:var(--panel2);color:#fff}main{padding-bottom:60px}}
.card{background:var(--panel);border:0;border-radius:var(--r);padding:16px;margin-bottom:16px;box-shadow:none}
.card h2{font-size:20px;font-weight:700;letter-spacing:-.025em}
.card h3{color:var(--mut);font-size:13px;font-weight:400;text-transform:uppercase;letter-spacing:0}
input,select,textarea{background:var(--panel2);border:0;border-radius:10px;padding:11px 12px;color:var(--txt);font-size:17px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-2px}
label{font-size:13px;color:var(--mut);margin:0 0 5px 4px}
.btn{background:var(--acc);color:#fff;border-radius:12px;padding:11px 18px;font-weight:600;font-size:17px;transition:opacity .15s}
.btn:active{opacity:.6}
.btn.sec{background:var(--panel2);border:0;color:var(--acc)}
.btn.bad{background:var(--panel2);color:var(--bad)}
.btn.sm{padding:6px 12px;border-radius:999px;font-size:15px}
.tag{border-radius:999px;background:var(--panel2);border:0;font-size:13px;padding:3px 10px}
.tag.ok{color:var(--ok)}.tag.bad{color:var(--bad)}.tag.warn{color:var(--warn)}
th,td{border-bottom:.5px solid var(--line)}
.mut{color:var(--mut);font-size:15px}
.screen{background:var(--panel2);border:0;border-radius:12px}
.calcell{min-width:0;overflow:hidden;background:none;border:0;border-radius:10px;min-height:64px;padding:4px 2px;text-align:center}
.calcell .cnum{font-size:15px;font-weight:400;color:var(--txt);display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:14px}
.calcell.today{outline:0;background:none}
.calcell.today .cnum{background:var(--bad);color:#fff;font-weight:600}
.calcell .dav{margin:2px auto 0}
.chip{background:#0a84ff33;color:#64b5ff;border-radius:4px;padding:1px 4px;margin-top:2px;font-size:11px;font-weight:600;text-align:left;cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.dav{box-shadow:none}
#toast{background:#2c2c2ef2;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:0;border-radius:14px;padding:12px 18px;font-weight:500;font-size:15px;bottom:calc(90px + env(safe-area-inset-bottom))}
#dlg,#pwdlg{background:#0000008c!important;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#dlg>div,#pwdlg form{background:var(--panel)!important;border:0;border-radius:16px;box-shadow:0 20px 60px #000c}
#login{background:var(--bg)}
#login form{background:var(--panel)}
.task{border-bottom:.5px solid var(--line);padding:11px 0}
.task:last-child{border-bottom:0}
.task input[type=checkbox]{appearance:none;-webkit-appearance:none;width:24px;height:24px;border-radius:12px;border:1.5px solid #636366;background:transparent;padding:0;display:grid;place-content:center;cursor:pointer;flex:none}
.task input[type=checkbox]:checked{background:var(--acc);border-color:var(--acc)}
.task input[type=checkbox]:checked::after{content:'';width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
/* home */
.hello{margin:12px 4px 16px}.hello h2{font-size:34px;font-weight:700;letter-spacing:-.035em;margin:0}.hello p{margin:2px 0 0;color:var(--mut);font-size:15px}
.hgrid{display:grid;gap:16px;grid-template-columns:1fr}
.hgrid .side{display:contents}.hgrid .hero{order:-1}
@media(min-width:900px){.hgrid{grid-template-columns:1.5fr 1fr;align-items:start}.hgrid .side{display:flex;flex-direction:column;gap:16px}}
.hgrid .card{margin:0}
.eyebrow{font-size:13px;font-weight:600;text-transform:uppercase;color:var(--mut);margin-bottom:10px;display:flex;align-items:center;gap:6px;letter-spacing:0}
.hero{overflow:hidden}
.bigav{width:60px;height:60px;border-radius:30px;display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:22px;color:#fff;flex:none}
.hero .who{font-size:28px;font-weight:700;letter-spacing:-.03em}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;background:var(--panel2);font-size:13px;font-weight:600;color:var(--txt)}
.pill.me{background:#30d15826;color:var(--ok)}
.evbig{cursor:pointer}.evbig .t{font-size:22px;font-weight:700;letter-spacing:-.025em}
.count{font-size:44px;font-weight:700;letter-spacing:-.04em;line-height:1;color:var(--acc)}
.link{color:var(--acc);font-size:15px;font-weight:400;cursor:pointer;background:none;border:0;padding:0;font-family:inherit;text-transform:none}
/* lista stile Impostazioni */
.glist{background:var(--panel);border-radius:var(--r);overflow:hidden;margin-bottom:22px}
.glist .gi{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:48px;cursor:pointer;width:100%;background:none;border:0;color:var(--txt);font:inherit;font-size:17px;text-align:left}
.glist .gi+.gi .gt{border-top:.5px solid var(--line)}
.glist .gt{flex:1;display:flex;align-items:center;min-height:48px}
.glist .ic{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;font-size:16px;flex:none}
.glist .chev{color:#5a5a5f;font-size:20px}
.ghead{font-size:13px;color:var(--mut);text-transform:uppercase;margin:0 0 7px 16px}
@media(max-width:600px){.calcell{min-height:58px}.chip{font-size:9px;padding:1px 2px}.card{padding:14px}.hello h2{font-size:32px}}
</style>
</head>
<body>
<div id="shell">
<header>
  <h1><span class="logo"><i></i><i></i><i></i><i></i><i></i><i></i></span>Ledwall</h1>
  <span class="sp"></span><span id="online"></span><span id="saveSt"></span><button id="pwbtn" style="display:none" aria-label="Profilo">👤</button><button class="btn sec sm" id="logout" style="display:none">Esci</button>
</header>
  <nav id="nav">
    <button data-v="calendario"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></svg>Home</button>
    <button data-v="eventi"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Eventi</button>
    <button data-v="turni"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.2c2.4-.3 4.1 1.3 4.6 4.3"/></svg>Turni</button>
    <button data-v="task"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1.2 1.2L7 5M3.5 12l1.2 1.2L7 11M3.5 18l1.2 1.2L7 17"/></svg>Task</button>

  </nav>
<main id="app"></main>
<div id="dlg"><div><p id="dlgTxt"></p><div class="row"><span class="sp"></span><button class="btn sec" id="dlgNo">Annulla</button><button class="btn bad" id="dlgYes">Conferma</button></div></div></div>

<div id="pwdlg" style="position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:45;padding:20px"><form class="card" id="pwForm" style="max-width:360px;width:100%"><h2>Profilo</h2>

<button class="btn" style="width:100%">Accedi</button><p class="mut" id="lErr"></p></form></div>
</div>

<script id="appjs">
/* ===================== DATI ===================== */
const KEY='gestionale-ledwall-v1';
const CATS={led:'Casse LED',processore:'Processori / Controller',cavo:'Cavi',struttura:'Strutture / Appendimento',audio:'Audio / Video',altro:'Altro'};
const PER={none:'—',modulo:'per modulo',colonna:'per colonna',fila:'per fila',cassa:'per cassa LED',schermo:'per schermo',evento:'per evento'};
const uid=()=>Math.random().toString(36).slice(2,10);

function seed(){
  const led=uid();
  return {
    settings:{scorta:5},
    items:[
      {id:led,cat:'led',name:'Modulo P2.6 192x384 (cassa da 6)',qty:20,modPerCase:6,modW:500,modH:1000,pxW:192,pxH:384,kg:7.5,watt:180,autoPer:'none',autoQty:0,note:'Esempio: correggi misure, moduli per cassa e quantità'},
      {id:uid(),cat:'processore',name:'Processore video (es. Novastar)',qty:2,autoPer:'schermo',autoQty:1,maxPx:2300000,note:'maxPx = pixel gestibili'},
      {id:uid(),cat:'cavo',name:'Cavo alimentazione modulo-modulo',qty:150,autoPer:'modulo',autoQty:1,note:''},
      {id:uid(),cat:'cavo',name:'Cavo rete dati (RJ45) modulo-modulo',qty:150,autoPer:'modulo',autoQty:1,note:''},
      {id:uid(),cat:'cavo',name:'Cavo powerCON / Schuko alimentazione colonna',qty:40,autoPer:'colonna',autoQty:1,note:''},
      {id:uid(),cat:'cavo',name:'Cavo Cat6 lungo (processore → schermo) 30m',qty:8,autoPer:'schermo',autoQty:2,note:''},
      {id:uid(),cat:'struttura',name:'Barra di appendimento 1m',qty:20,autoPer:'colonna',autoQty:1,note:'1 per colonna (modulo 500mm → 1 barra ogni 2 colonne? correggi)'},
      {id:uid(),cat:'altro',name:'Multipresa / quadretto elettrico',qty:4,autoPer:'schermo',autoQty:1,note:''},
    ],
    events:[]
  };
}
const CFG=window.CONFIG||{};
let sb=null; try{if(CFG.SUPABASE_URL&&!/INCOLLA/.test(CFG.SUPABASE_URL))sb=supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_KEY)}catch(e){console.error(e)}
function localLoad(){try{const d=JSON.parse(localStorage.getItem(KEY));return d&&d.items?d:null}catch(e){return null}}
let DB=localLoad()||seed();
const IN_FRAME=false;
let pubTimer=null, dirty=false, USER=null;
// Ruoli: admin (Benni, Sebi) vedono e modificano tutto; gli altri vedono calendario turni e inventario in sola lettura.
// Il ruolo è in app_metadata.ruolo (impostabile solo dal server); il database blocca le modifiche dei non admin.
let ANTEPRIMA=false; try{ANTEPRIMA=sessionStorage.getItem(KEY+'-ante')==='1'}catch(e){}
function realAdmin(){return !!(USER&&USER.app_metadata&&USER.app_metadata.ruolo==='admin')}

// Dati condivisi tra tutti gli utenti: una sola riga 'main' nella tabella 'condiviso'
let BASE_T=null; // _t della versione online su cui stiamo lavorando
async function remote(){const {data,error}=await sb.from('condiviso').select('data').eq('id','main').maybeSingle();if(error)throw error;return data&&data.data}
async function push(){
  if(!USER||!dirty)return; dirty=false;
  try{
    const r=await remote();
    if(r&&r.items&&BASE_T!==null&&(r._t||0)>BASE_T){ // qualcun altro ha salvato nel frattempo
      LOGQ=[];DB=r;BASE_T=r._t||0;try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){};render();
      toast('Un altro utente ha modificato i dati: ho caricato la versione aggiornata, ripeti la tua ultima modifica');setSt('Sincronizzato ✓');return}
    const {error}=await sb.from('condiviso').upsert({id:'main',data:DB,updated_at:new Date().toISOString(),updated_by:USER.id});
    if(error)throw error; BASE_T=DB._t; setSt('Salvato ✓'); flushLog();
  }catch(e){dirty=true;setSt('⚠️ Non salvato online');console.error(e)}
}
async function pull(){
  if(!USER||dirty)return;
  let r; try{r=await remote()}catch(e){setSt('⚠️ Offline: salvo sul dispositivo');console.error(e);return}
  if(r&&r.items){ if(BASE_T===null||(r._t||0)!==BASE_T||(r._t||0)!==(DB._t||0)){const ui=document.activeElement&&document.activeElement.closest&&document.activeElement.closest('#app');DB=r;BASE_T=r._t||0;try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){};if(!ui)render()} setSt('Sincronizzato ✓')}
  else if(realAdmin()){BASE_T=DB._t||0;dirty=true;await push()}
}

function keyOf(el){
  if(!el||!el.dataset)return null;
  if(el.dataset.f){const w=el.closest('[data-item]');return w&&('i:'+w.dataset.item+':'+el.dataset.f)}
  if(el.dataset.ef)return 'e:'+curEv+':'+el.dataset.ef;
  if(el.dataset.sf){const w=el.closest('[data-scr]');return w&&('e:'+curEv+':s'+w.dataset.scr+':'+el.dataset.sf)}
  if(el.dataset.chk)return 'e:'+curEv+':c:'+el.dataset.chk;
  return null;
}

/* ===================== CALCOLO ===================== */
function screenCalc(s){
  const it=item(s.ledId); if(!it) return null;
  let cols,rows;
  if(s.mode==='metri'){cols=Math.ceil((+s.w*1000)/it.modW-1e-9);rows=Math.ceil((+s.h*1000)/it.modH-1e-9)}
  else{cols=Math.max(0,Math.round(+s.w));rows=Math.max(0,Math.round(+s.h))}
  const mods=cols*rows;
  const scorta=Math.ceil(mods*(+DB.settings.scorta||0)/100);
  const modsTot=mods+scorta;
  const cases=Math.ceil(modsTot/it.modPerCase);
  return {it,cols,rows,mods,scorta,modsTot,cases,
    leftover:cases*it.modPerCase-modsTot,
    pxW:cols*it.pxW,pxH:rows*it.pxH,
    mW:cols*it.modW/1000,mH:rows*it.modH/1000,
    kg:mods*(+it.kg||0),watt:mods*(+it.watt||0)};
}
function overlap(a,b){return a.start<= (b.end||b.start) && b.start <= (a.end||a.start)}
function usedElsewhere(ev,itemId){
  // massimo impegno dello stesso materiale da altri eventi che si sovrappongono
  let used=0;
  DB.events.forEach(o=>{ if(o.id===ev.id||!ev.start||!o.start||!overlap(ev,o))return;
    const n=needs(o)[itemId]; if(n) used+=n.qty; });
  return used;
}
function needs(ev){
  const need={}; const add=(id,q,why)=>{ if(!q)return; need[id]=need[id]||{qty:0,why:[]}; need[id].qty+=q; need[id].why.push(why)};
  const calcs=(ev.screens||[]).map(screenCalc).filter(Boolean);
  let totMods=0,totCols=0,totRows=0,totCases=0;
  calcs.forEach((c,i)=>{const nm=ev.screens[i].name||('Schermo '+(i+1));
    add(c.it.id,c.cases,`${nm}: ${c.modsTot} moduli → ${c.cases} casse`);
    totMods+=c.mods;totCols+=c.cols;totRows+=c.rows;totCases+=c.cases;});
  DB.items.forEach(it=>{ if(!it.autoPer||it.autoPer==='none'||!(+it.autoQty))return; const q=+it.autoQty;
    if(it.autoPer==='modulo') add(it.id,Math.ceil(q*totMods),`${q} × ${totMods} moduli`);
    if(it.autoPer==='colonna') add(it.id,Math.ceil(q*totCols),`${q} × ${totCols} colonne`);
    if(it.autoPer==='fila') add(it.id,Math.ceil(q*totRows),`${q} × ${totRows} file`);
    if(it.autoPer==='cassa') add(it.id,Math.ceil(q*totCases),`${q} × ${totCases} casse`);
    if(it.autoPer==='schermo' && calcs.length){
      if(it.cat==='processore' && +it.maxPx){ let n=0; calcs.forEach(c=>n+=Math.max(1,Math.ceil(c.pxW*c.pxH/+it.maxPx))*q); add(it.id,n,`in base ai pixel (max ${(+it.maxPx).toLocaleString('it-IT')} px)`); }
      else add(it.id,Math.ceil(q*calcs.length),`${q} × ${calcs.length} schermi`);
    }
    if(it.autoPer==='evento') add(it.id,Math.ceil(q),'fisso per evento');
  });
  (ev.extras||[]).forEach(x=>add(x.itemId,+x.qty,'aggiunto a mano'));
  return need;
}

/* ---------- Lista eventi ---------- */
function vEvents(){
  const today=new Date().toISOString().slice(0,10);
  const evs=[...DB.events].sort((a,b)=>(a.start||'').localeCompare(b.start||''));
  const fut=evs.filter(e=>(e.end||e.start||'9')>=today), past=evs.filter(e=>(e.end||e.start||'9')<today);
  const row=e=>{const st=status(e);return `<div class="ev" data-open="${e.id}"><div><b>${esc(e.name||'Senza nome')}</b><div class="mut">${fmtD(e.start)}${e.end&&e.end!==e.start?' → '+fmtD(e.end):''} ${e.place?'· '+esc(e.place):''}</div></div><span class="sp"></span><span class="tag ${st.cls}">${st.txt}</span></div>${e._by?`<div class="by" style="padding:0 10px 8px">✏️ ${esc(e._by)} · ${ago(e._at)}</div>`:''}`};
  return `<div class="card"><div class="row"><h2 style="margin:0">Eventi</h2><span class="sp"></span><button class="btn" data-act="addEv">+ Nuovo evento</button></div></div>
  <div class="card evlist"><h3 style="margin-top:0">Prossimi</h3>${fut.map(row).join('')||'<p class="mut">Nessun evento. Crea il primo con "+ Nuovo evento".</p>'}
  ${past.length?`<h3>Passati</h3>${past.map(row).join('')}`:''}</div>`;
}
function status(ev){
  const n=needs(ev); let miss=0;
  Object.entries(n).forEach(([id,x])=>{const it=item(id); if(it && x.qty>it.qty-usedElsewhere(ev,id)) miss++});
  if(!Object.keys(n).length) return {cls:'',txt:'Da compilare'};
  return miss?{cls:'bad',txt:`${miss} mancanti`}:{cls:'ok',txt:'Materiale OK'};
}

function vEvent(id){
  const ev=DB.events.find(e=>e.id===id); if(!ev){curEv=null;return vEvents()}

function nextSunday(){const d=new Date();d.setDate(d.getDate()+((7-d.getDay())%7));return d.toISOString().slice(0,10)}
function turni(){if(!DB.turni)DB.turni={start:nextSunday(),persone:['Sebi','Lucas','Matteo','Edo'],jolly:'Benni',slot:['Mattina','Sera'],override:{}};DB.turni.override=DB.turni.override||{};return DB.turni}
function isSunday(ds){return new Date(ds+'T12:00').getDay()===0}
// Una persona per domenica (copre mattina e sera), ma mattina (slot 0) e sera (slot 1) si possono cambiare singolarmente.
// Override: 'YYYY-MM-DD:0' / 'YYYY-MM-DD:1' per singolo turno, 'YYYY-MM-DD' per tutta la giornata.
function turno(ds,slot){const T=turni();if(slot!==undefined){const os=T.override[ds+':'+slot];if(os!==undefined)return os}const o=T.override[ds];if(o!==undefined)return o;
  const P=T.persone.filter(Boolean);if(!P.length||!T.start||ds<T.start)return '';
  const w=Math.round((new Date(ds+'T12:00')-new Date(T.start+'T12:00'))/(7*864e5));if(w<0)return '';
  // se chi tocca è assente: il prossimo libero in lista; il jolly solo se nessuno è libero
  for(let k=0;k<P.length;k++){const n=P[(w+k)%P.length];if(!bloccato(n,ds))return n}
  return bloccato(T.jolly,ds)?'':(T.jolly||'')}
// persona della rotazione senza sostituzioni (per sapere chi è stato sostituito)
function turnoBase(ds){const T=turni(),P=T.persone.filter(Boolean);if(!P.length||!T.start||ds<T.start)return '';const w=Math.round((new Date(ds+'T12:00')-new Date(T.start+'T12:00'))/(7*864e5));return w<0?'':P[w%P.length]}
function first(n){return String(n||'').trim().split(/\s+/)[0]}
function isMe(n){return USER&&n&&first(n).toLowerCase()===first(myName()).toLowerCase()}
function sundays(k){const out=[];const d=new Date(nextSunday()+'T12:00');for(let i=0;i<k;i++){out.push(d.toISOString().slice(0,10));d.setDate(d.getDate()+7)}return out}
function vTurni(){
  const T=turni(), opts=[...T.persone,T.jolly].filter(Boolean);

    return `<select data-turno="${ds}:${sl}" style="${isMe(cur)?'border-color:var(--ok);':''}${ov?'font-style:italic;border-color:var(--warn)':''}"><option value="__auto" ${!ov?'selected':''}>Auto</option>${opts.map(o=>`<option value="${esc(o)}" ${ov&&cur===o?'selected':''}>${esc(o)}${bloccato(o,ds)?' 🚫':''}</option>`).join('')}<option value="" ${ov&&cur===''?'selected':''}>Nessuno</option></select>${cur&&bloccato(cur,ds)?`<div class="bad" style="font-size:12px;margin-top:3px">🚫 ${esc(cur)} non c'è</div>`:''}${!ov&&cur&&turnoBase(ds)&&cur!==turnoBase(ds)?`<div class="warn" style="font-size:12px;margin-top:3px">🔁 ${esc(cur)} al posto di ${esc(turnoBase(ds))}</div>`:''}`};
  return `<div class="card"><div class="row"><h2 style="margin:0">⛪ Turni della domenica</h2><span class="sp"></span><button class="btn sec sm" data-act="toggleTset">⚙️ Impostazioni</button></div>
  <p class="mut">Di base una persona per domenica (${esc(T.slot[0].toLowerCase())} e ${esc(T.slot[1].toLowerCase())}), a rotazione tra ${T.persone.length} persone. ${esc(T.jolly)} è il jolly. Se qualcuno non c'è, cambia solo la mattina o solo la sera scegliendo un altro nome; "Auto" torna alla rotazione. I cambi sono evidenziati in arancione.</p>
  ${window.TSET?`<div class="screen grid">
    <div style="grid-column:span 2"><label>Persone in rotazione (una per riga, in ordine)</label><textarea data-tset="persone" rows="5">${esc(T.persone.join('\n'))}</textarea></div>
    <div><label>Jolly</label><input data-tset="jolly" value="${esc(T.jolly)}"></div>
    <div><label>Prima domenica della rotazione</label><input type="date" data-tset="start" value="${T.start}"></div>
    </div>`:''}
  <table><tr><th>Domenica</th><th>☀️ ${esc(T.slot[0])}</th><th>🌙 ${esc(T.slot[1])}</th></tr>
  ${sundays(window.TMORE?26:10).map(ds=>`<tr><td>${fmtD(ds)}</td><td>${sel(ds,0)}</td><td>${sel(ds,1)}</td></tr>`).join('')}</table>
  ${window.TMORE?'':'<button class="btn sec sm" data-act="moreTurni" style="margin-top:10px">Mostra altre domeniche</button>'}</div>`;
}
function autoTurno(ds,sl){const T=turni();const k=ds+':'+sl;const o=T.override[k];delete T.override[k];const r=turno(ds,sl);if(o!==undefined)T.override[k]=o;return r}
const PAL=['#e5484d','#4f8cff','#2fbf71','#f0a020','#a855f7','#14b8a6','#ec4899','#84cc16'];
function pcol(n){const T=turni();const L=[...T.persone,T.jolly].filter(Boolean).map(first);const i=L.indexOf(first(n));return i>=0?PAL[i%PAL.length]:colorOf(n)}
function dav(n,sl,ds){const T=turni(), b=ds&&bloccato(n,ds);return `<span class="dav${isMe(n)?' me':''}${b?' blk':''}" style="background:${pcol(n)}" title="${esc((sl===null?'Di turno':T.slot[sl])+': '+n+(b?' (non c\'è)':''))}">${esc(initials(n))}${sl===null?'':`<i>${sl?'🌙':'☀️'}</i>`}</span>`}
function davDay(ds){const m=turno(ds,0),e=turno(ds,1);if(!m&&!e)return '';return `<div>${m===e?dav(m,null,ds):(m?dav(m,0,ds):'')+(e?dav(e,1,ds):'')}</div>`}
function legenda(){const T=turni();return `<div class="row" style="margin-top:10px;gap:12px">${[...T.persone,T.jolly].filter(Boolean).map(n=>`<span class="row" style="gap:5px"><span class="dav" style="background:${pcol(n)};margin:0">${esc(initials(n))}</span><span class="mut">${esc(n)}${n===T.jolly?' (jolly)':''}</span></span>`).join('')}</div>`}
let CALOFF=0; // mesi di spostamento dal mese corrente (frecce)
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-calm]');if(!b)return;const v=+b.dataset.calm;CALOFF=v?CALOFF+v:0;render()});
function vCal(){
  const base=new Date(); base.setDate(1); base.setMonth(base.getMonth()+CALOFF); const oggi=new Date().toISOString().slice(0,10);
  const y=base.getFullYear(),mo=base.getMonth(),days=new Date(y,mo+1,0).getDate(),off=(base.getDay()+6)%7;
  const cell=(d,extra)=>{const ds=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const evs=isAdmin()?DB.events.filter(e=>e.start&&e.start<=ds&&ds<=(e.end||e.start)):[];
    const tu=isSunday(ds)?davDay(ds):'';
    const tk=taskAperti().filter(x=>x.scadenza===ds).length;
    return `<div class="calcell${ds===oggi?' today':''}${isSunday(ds)?' dom':''}"${extra?' style="opacity:.35"':''}><div><span class="cnum">${d.getDate()}</span>${extra&&d.getDate()===1?'<span class="mut"> '+d.toLocaleDateString('it-IT',{month:'short'})+'</span>':''}${tk?` <span title="${tk} task in scadenza" style="font-size:11px">✅${tk>1?tk:''}</span>`:''}</div>${tu}${evs.map(e=>`<div class="chip" data-open="${e.id}">${esc(e.name||'Evento')}</div>`).join('')}</div>`};
  let h=`<div class="card"><div class="row" style="margin-bottom:10px;flex-wrap:nowrap"><button class="btn sec sm" data-calm="-1" aria-label="Mese precedente">‹</button><h2 style="text-transform:capitalize;margin:0;flex:1;text-align:center">${base.toLocaleDateString('it-IT',{month:'long',year:'numeric'})}</h2>${CALOFF?'<button class="btn sec sm" data-calm="0">Oggi</button>':''}<button class="btn sec sm" data-calm="1" aria-label="Mese successivo">›</button></div><div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px">`;
  ['L','M','M','G','V','S','D'].forEach(x=>h+=`<div class="mut" style="text-align:center;font-size:11px;font-weight:600;letter-spacing:.06em">${x}</div>`);
  for(let i=0;i<off;i++)h+='<div></div>';
  for(let g=1;g<=days;g++)h+=cell(new Date(y,mo,g),false);
  // giorni del mese successivo fino alla domenica dopo la fine del mese
  const d=new Date(y,mo,days+1); do{h+=cell(new Date(d),true);d.setDate(d.getDate()+1)}while(new Date(d.getTime()-864e5).getDay()!==0);
  h+=`</div>${legenda()}</div>`;
  return h;
}

/* ---------- Pixelmap animata (loop con radar) ---------- */
const PM_LOOP=4; // secondi di un giro del radar = durata del loop
const CAB_COL=['#ffd60a','#0a84ff','#ff375f','#30d158','#bf5af2','#ff9f0a','#64d2ff','#ffffff'];
// cablaggio a serpentina: ordine dei moduli, porte dati (pixel max per porta) e linee di corrente (ampere)
function cabPlan(c,s){
  const start=s.cabStart||'BL', dir=s.cabDir||'col', A=+s.cabA||32, watt=+c.it.watt||0;
  const fromRight=start[1]==='R', fromBottom=start[0]==='B', order=[];
  if(dir==='col'){for(let a=0;a<c.cols;a++){const k=fromRight?c.cols-1-a:a;for(let b=0;b<c.rows;b++){const up=(a%2===0)===fromBottom;order.push([k,up?c.rows-1-b:b])}}}
  else{for(let a=0;a<c.rows;a++){const r=fromBottom?c.rows-1-a:a;for(let b=0;b<c.cols;b++){const lr=(a%2===0)!==fromRight;order.push([lr?b:c.cols-1-b,r])}}}
  const mpp=Math.max(1,Math.round(+s.cabMpp||12));
  let chains=[];
  if(s.cabMode==='man')chains=((s.cabMan&&s.cabMan.ports)||[[]]).map(ch=>ch.filter(([k,r])=>k<c.cols&&r<c.rows));
  else for(let i=0;i<order.length;i+=mpp)chains.push(order.slice(i,i+mpp));
  if(!chains.length)chains=[[]];
  const all=chains.flat(), mpl=watt?Math.max(1,Math.floor(A*230/watt)):Math.max(1,all.length);
  const pos={};let g=0;chains.forEach((ch,p)=>ch.forEach(([k,r],i)=>{pos[k+','+r]={p:p+1,idx:i+1,l:Math.floor(g++/mpl)+1}}));
  return {order,chains,mpp,mpl,ports:chains.length,lines:Math.max(1,Math.ceil(all.length/mpl)),pos,A,liberi:c.cols*c.rows-all.length,troppi:chains.map((ch,i)=>ch.length>mpp?i+1:0).filter(Boolean)};
}
function pmDraw(g,c,t,scr){
  const W=c.pxW,H=c.pxH,mw=c.it.pxW,mh=c.it.pxH;
  g.save();g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,g.canvas.width,g.canvas.height);g.scale(g.canvas.width/W,g.canvas.height/H);
  // un solo colore per schermo (tinta diversa per ogni schermo dell'evento), due tonalità a scacchiera sulle parti di ogni modulo
  const q=Math.min(mw,mh)/2, nx=Math.max(1,Math.round(mw/q)), ny=Math.max(1,Math.round(mh/q)), qw=mw/nx, qh=mh/ny;
  const hue=[350,180,110,285,30,210,320,55][(scr._i||0)%8], C1=`hsl(${hue},55%,62%)`, C2=`hsl(${hue},58%,40%)`;
  const fw=Math.max(2,Math.round(Math.min(mw,mh)*.03)), cab=scr.cabOn==='1'?cabPlan(c,scr):null;
  for(let r=0;r<c.rows;r++)for(let k=0;k<c.cols;k++){const n=r*c.cols+k, x0=k*mw, y0=r*mh, cp=cab&&cab.pos[k+','+r];
    for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){g.fillStyle=((k*nx+i)+(r*ny+j))%2?C2:C1;g.fillRect(x0+i*qw,y0+j*qh,qw+.5,qh+.5)}
    g.strokeStyle=`hsl(${hue},45%,18%)`;g.lineWidth=fw;g.strokeRect(x0+fw/2,y0+fw/2,mw-fw,mh-fw);
    // numero del modulo, al centro
    const fs=Math.max(9,Math.round(qw*.36)), lab=cp?`P${cp.p} · ${cp.idx}`:`${n+1}`, pos=cp?`⚡ L${cp.l}`:`C${k+1} · F${r+1}`, mx=x0+mw/2, my=cp?y0+mh*.24:y0+mh/2;
    g.textAlign='center';g.textBaseline='middle';
    g.font=`600 ${Math.round(fs*.6)}px -apple-system,system-ui,sans-serif`;const pw=g.measureText(pos).width;
    g.font=`800 ${fs}px -apple-system,system-ui,sans-serif`;const bw=Math.max(g.measureText(lab).width,pw)+fs*.8, bh=fs*2;
    g.fillStyle='rgba(0,0,0,.55)';g.beginPath();g.roundRect?g.roundRect(mx-bw/2,my-bh/2,bw,bh,fs*.3):g.rect(mx-bw/2,my-bh/2,bw,bh);g.fill();
    g.fillStyle='#fff';g.fillText(lab,mx,my-fs*.32);
    g.fillStyle='rgba(255,255,255,.8)';g.font=`600 ${Math.round(fs*.6)}px -apple-system,system-ui,sans-serif`;g.fillText(pos,mx,my+fs*.55);}
  if(cab){pmCab(g,c,t,scr,cab);g.restore();return}
  // radar dal centro (leggero)
  const cx=W/2,cy=H/2,R=Math.hypot(W,H)/2,a=t/PM_LOOP*Math.PI*2-Math.PI/2, lw=Math.max(2,Math.round(Math.min(mw,mh)/64));
  if(g.createConicGradient){const cg=g.createConicGradient(a-1,cx,cy);const k1=1/(Math.PI*2);cg.addColorStop(0,'rgba(255,255,255,0)');cg.addColorStop(k1,'rgba(255,255,255,.35)');cg.addColorStop(k1+.001,'rgba(255,255,255,0)');cg.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=cg;g.fillRect(0,0,W,H)}
  g.strokeStyle='rgba(255,255,255,.9)';g.lineWidth=lw*1.5;g.beginPath();g.moveTo(cx,cy);g.lineTo(cx+Math.cos(a)*R,cy+Math.sin(a)*R);g.stroke();
  // diagonali, cerchio e croce centrale
  g.strokeStyle='rgba(255,255,255,.55)';g.lineWidth=lw;g.beginPath();g.moveTo(0,0);g.lineTo(W,H);g.moveTo(W,0);g.lineTo(0,H);g.stroke();
  g.beginPath();g.arc(cx,cy,Math.min(W,H)*.32,0,Math.PI*2);g.stroke();
  g.setLineDash([lw*4,lw*3]);g.beginPath();g.moveTo(cx,0);g.lineTo(cx,H);g.moveTo(0,cy);g.lineTo(W,cy);g.stroke();g.setLineDash([]);
  // cornice esterna
  const ow=Math.max(3,lw*2);g.strokeStyle='#fff';g.lineWidth=ow;g.strokeRect(ow/2,ow/2,W-ow,H-ow);
  // etichetta centrale come nelle pixelmap professionali
  let big=Math.max(16,Math.round(Math.min(W*.14,H*.1)));{g.font='800 '+big+'px -apple-system,system-ui,sans-serif';const m=g.measureText(scr.name||'Schermo').width+big;if(m>W*.9)big=Math.max(14,Math.floor(big*W*.9/m))}const sm=Math.max(10,Math.round(big*.42));
  g.textAlign='center';g.textBaseline='middle';g.font=`800 ${big}px -apple-system,system-ui,sans-serif`;
  const l1=scr.name||'Schermo', l2=`W: ${W}  H: ${H}`, l3=`${c.cols} × ${c.rows} moduli · ${mw}×${mh} px`;
  const w1=g.measureText(l1).width;g.font=`700 ${sm}px -apple-system,system-ui,sans-serif`;const bw=Math.max(w1,g.measureText(l3).width)+big;const bh=big*1.2+sm*2.9;
  g.fillStyle='rgba(0,0,0,.6)';g.beginPath();g.roundRect?g.roundRect(cx-bw/2,cy-bh/2,bw,bh,big*.3):g.rect(cx-bw/2,cy-bh/2,bw,bh);g.fill();
  g.fillStyle='#fff';g.font=`800 ${big}px -apple-system,system-ui,sans-serif`;g.fillText(l1,cx,cy-bh/2+big*.75);
  g.font=`700 ${sm}px -apple-system,system-ui,sans-serif`;g.fillText(l2,cx,cy-bh/2+big*1.35+sm*.7);g.fillStyle='rgba(255,255,255,.8)';g.fillText(l3,cx,cy-bh/2+big*1.35+sm*1.95);
  g.restore();
}
function pmCab(g,c,t,scr,cab){
  const W=c.pxW,H=c.pxH,mw=c.it.pxW,mh=c.it.pxH,lw=Math.max(3,Math.round(Math.min(mw,mh)/22));
  const cen=([k,r])=>[k*mw+mw/2,r*mh+mh/2];
  if(scr.cabMode==='man')for(let r=0;r<c.rows;r++)for(let k=0;k<c.cols;k++)if(!cab.pos[k+','+r]){g.fillStyle='rgba(0,0,0,.55)';g.fillRect(k*mw,r*mh,mw,mh)}
  for(let p=0;p<cab.ports;p++){const pts=cab.chains[p].map(cen), col=CAB_COL[p%CAB_COL.length];if(!pts.length)continue;
    g.lineCap='round';g.lineJoin='round';
    g.strokeStyle='rgba(0,0,0,.6)';g.lineWidth=lw*1.9;g.beginPath();pts.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.stroke();
    g.strokeStyle=col;g.lineWidth=lw;g.beginPath();pts.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.stroke();
    // flusso del segnale che scorre (in loop)
    g.strokeStyle='rgba(255,255,255,.85)';g.lineWidth=lw*.45;g.setLineDash([lw*1.2,lw*4.8]);g.lineDashOffset=-(t/PM_LOOP)*lw*6*8;
    g.beginPath();pts.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.stroke();g.setLineDash([]);
    // frecce sui collegamenti
    for(let i=1;i<pts.length;i++){const [x1,y1]=pts[i-1],[x2,y2]=pts[i],a=Math.atan2(y2-y1,x2-x1),mx=(x1+x2)/2,my=(y1+y2)/2,z=lw*1.6;
      g.fillStyle=col;g.beginPath();g.moveTo(mx+Math.cos(a)*z,my+Math.sin(a)*z);g.lineTo(mx+Math.cos(a+2.5)*z,my+Math.sin(a+2.5)*z);g.lineTo(mx+Math.cos(a-2.5)*z,my+Math.sin(a-2.5)*z);g.closePath();g.fill()}
    // ingresso della porta
    const [sx,sy]=pts[0],rr=lw*2.6;g.fillStyle=col;g.beginPath();g.arc(sx,sy,rr,0,Math.PI*2);g.fill();g.strokeStyle='#000';g.lineWidth=lw*.4;g.stroke();
    g.fillStyle='#000';g.font=`900 ${Math.round(rr*1.05)}px -apple-system,system-ui,sans-serif`;g.textAlign='center';g.textBaseline='middle';g.fillText('P'+(p+1),sx,sy+rr*.05);}
  const ow=Math.max(3,lw*.7);g.strokeStyle='#fff';g.lineWidth=ow;g.strokeRect(ow/2,ow/2,W-ow,H-ow);
}
function pmScreen(i){const ev=curEv&&DB.events.find(x=>x.id===curEv);const s0=ev&&ev.screens[+i];const c=s0&&screenCalc(s0);return c&&c.pxW&&c.pxH?{s:{...s0,_i:+i},c,ev}:null}
(function pmAnim(){const t=(performance.now()/1000)%PM_LOOP;
  document.querySelectorAll('canvas[data-pm]').forEach(cv=>{const o=pmScreen(cv.dataset.pm);if(o)pmDraw(cv.getContext('2d'),o.c,t,o.s)});
  requestAnimationFrame(pmAnim)})();
function pmFile(o,ext){return `pixelmap-${(o.s.name||'schermo').replace(/[^\w-]+/g,'_')}-${o.c.pxW}x${o.c.pxH}.${ext}`}
function pmSave(blob,name){const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}
document.addEventListener('click',async e=>{
  const b=e.target.closest&&e.target.closest('[data-pmpng],[data-pmvid]');if(!b)return;
  const o=pmScreen(b.dataset.pmpng??b.dataset.pmvid);if(!o)return;
  const cv=document.createElement('canvas');cv.width=o.c.pxW;cv.height=o.c.pxH;const g=cv.getContext('2d');
  if(b.dataset.pmpng!==undefined){pmDraw(g,o.c,PM_LOOP*.125,o.s);cv.toBlob(bl=>pmSave(bl,pmFile(o,'png')),'image/png');return}
  if(!cv.captureStream||!window.MediaRecorder){toast('Questo browser non può creare video: usa Safari o Chrome aggiornati');return}
  const tipi=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm'];const mime=tipi.find(m=>MediaRecorder.isTypeSupported(m));
  if(!mime){toast('Video non supportato da questo browser');return}
  if(o.c.pxW*o.c.pxH>4096*2160)toast('Schermo molto grande: il video potrebbe non riuscire, prova il PNG');
  const fps=30,frames=PM_LOOP*fps,st=cv.captureStream(0),tr=st.getVideoTracks()[0];
  const rec=new MediaRecorder(st,{mimeType:mime,videoBitsPerSecond:Math.min(40e6,o.c.pxW*o.c.pxH*12)});const parts=[];
  rec.ondataavailable=ev=>ev.data.size&&parts.push(ev.data);
  const fine=new Promise(r=>rec.onstop=r);
  b.disabled=true;const txt0=b.textContent;
  pmDraw(g,o.c,0,o.s);rec.start();
  for(let f=0;f<frames;f++){pmDraw(g,o.c,f/fps,o.s);if(tr.requestFrame)tr.requestFrame();b.textContent=`⏳ ${Math.round(f/frames*100)}%`;await new Promise(r=>setTimeout(r,1000/fps))}
  rec.stop();await fine;b.disabled=false;b.textContent=txt0;
  pmSave(new Blob(parts,{type:mime.split(';')[0]}),pmFile(o,mime.includes('mp4')?'mp4':'webm'));toast('Video pronto ✓ (dura '+PM_LOOP+' s e va in loop)');
});

/* ---------- Cablaggio a mano (come NovaLCT) ---------- */
let CABDRAG=null;
function cabScr(i){const ev=curEv&&DB.events.find(x=>x.id===curEv);return ev&&ev.screens[+i]?{ev,s:ev.screens[+i]}:null}
function cabMan(s){s.cabMan=s.cabMan||{ports:[[]]};if(!s.cabMan.ports.length)s.cabMan.ports=[[]];return s.cabMan}
function cabSave(o,msg){stamp(o.ev);if(msg)logChange(`Evento "${o.ev.name}", ${o.s.name}: ${msg}`);save()}
function cabCell(cv,e){const o=pmScreen(cv.dataset.pm);if(!o)return null;const r=cv.getBoundingClientRect();
  const x=(e.clientX-r.left)/r.width*o.c.pxW,y=(e.clientY-r.top)/r.height*o.c.pxH;const k=Math.floor(x/o.c.it.pxW),rr=Math.floor(y/o.c.it.pxH);
  return k>=0&&rr>=0&&k<o.c.cols&&rr<o.c.rows?[k,rr]:null}
function cabTocca(i,cell,primo){const o=cabScr(i);if(!o)return;const M=cabMan(o.s),ap=Math.min(CABPORT[i]||0,M.ports.length-1),ch=M.ports[ap];
  const key=cell.join(','),dove=M.ports.findIndex(c=>c.some(m=>m.join(',')===key));
  if(dove>=0){if(primo){M.ports[dove]=M.ports[dove].filter(m=>m.join(',')!==key);CABDRAG.tolto=true}return}
  if(CABDRAG&&CABDRAG.tolto)return; ch.push(cell);}
document.addEventListener('pointerdown',e=>{const cv=e.target.closest&&e.target.closest('canvas[data-pm]');if(!cv)return;const o=cabScr(cv.dataset.pm);
  if(!o||o.s.cabOn!=='1'||o.s.cabMode!=='man')return;e.preventDefault();cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);
  CABDRAG={i:cv.dataset.pm,cv,last:null,tolto:false};const cell=cabCell(cv,e);if(cell){CABDRAG.last=cell.join(',');cabTocca(cv.dataset.pm,cell,true)}});
document.addEventListener('pointermove',e=>{if(!CABDRAG)return;const cell=cabCell(CABDRAG.cv,e);if(!cell||cell.join(',')===CABDRAG.last)return;CABDRAG.last=cell.join(',');cabTocca(CABDRAG.i,cell,false)});
document.addEventListener('pointerup',()=>{if(!CABDRAG)return;const o=cabScr(CABDRAG.i);CABDRAG=null;if(o){cabSave(o,'modificato il cablaggio a mano');render()}});
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-cabport],[data-cabadd],[data-cabundo],[data-cabclr],[data-cabcopy],[data-caball]');if(!b)return;
  const d=b.dataset;
  if(d.cabport){const [i,p]=d.cabport.split(':');CABPORT[i]=+p;render();return}
  const i=d.cabadd||d.cabundo||d.cabclr||d.cabcopy||d.caball, o=cabScr(i);if(!o)return;const M=cabMan(o.s),ap=Math.min(CABPORT[i]||0,M.ports.length-1);
  if(d.cabadd){M.ports.push([]);CABPORT[i]=M.ports.length-1;cabSave(o,'aggiunta una porta')}
  else if(d.cabundo){M.ports[ap].pop();cabSave(o)}
  else if(d.cabclr){M.ports[ap]=[];cabSave(o,`svuotata la porta P${ap+1}`)}
  else if(d.cabcopy){const c=screenCalc(o.s);const cp=cabPlan(c,{...o.s,cabMode:''});M.ports=cp.chains.map(ch=>ch.map(x=>[...x]));CABPORT[i]=0;cabSave(o,'cablaggio a mano copiato dall\'automatico')}
  else if(d.caball){M.ports=[[]];CABPORT[i]=0;cabSave(o,'cablaggio a mano svuotato')}
  render()});
/* ---------- Home ---------- */
function vHome(){
  const adm=isAdmin(), oggi=oggiS(), me=first(myName());
  const ora=new Date().getHours(), saluto=ora<12?'Buongiorno':ora<18?'Ciao':'Buonasera';
  const dataLunga=new Date().toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'});
  const giorni=ds=>Math.round((new Date(ds+'T12:00')-new Date(oggi+'T12:00'))/864e5);
  const quando=n=>n===0?'oggi':n===1?'domani':`tra ${n} giorni`;
  // prossima domenica
  const ds=sundays(1)[0], m=turno(ds,0), e=turno(ds,1), chi=m===e?m:[m,e].filter(Boolean).join(' / ');
  const mio=[m,e].some(x=>x&&isMe(x));
  const big=n=>`<span class="bigav" style="background:${pcol(n)}">${esc(initials(n))}</span>`;
  const hero=`<div class="card hero" style="--hc:${m?pcol(m):'#8b7cff'}"><div class="eyebrow">⛪ Prossima domenica · ${new Date(ds+'T12:00').toLocaleDateString('it-IT',{day:'numeric',month:'long'})}</div>
    ${chi?`<div class="row" style="gap:14px;flex-wrap:nowrap">${m===e?big(m):(m?big(m):'')+(e?big(e):'')}<div><div class="who">${esc(chi)}</div><div style="margin-top:6px" class="row">${mio?'<span class="pill me">✨ Tocca a te</span>':''}<span class="pill">${quando(giorni(ds))}</span>${m!==e?'<span class="pill">☀️ / 🌙 divisi</span>':''}</div></div></div>`:'<p class="mut">Nessun turno impostato.</p>'}
    ${(()=>{const miei=sundays(12).filter(x=>x!==ds&&[turno(x,0),turno(x,1)].some(n=>n&&isMe(n)));return miei.length?`<div class="mut" style="margin-top:14px">I tuoi prossimi turni: ${miei.slice(0,3).map(x=>new Date(x+'T12:00').toLocaleDateString('it-IT',{day:'numeric',month:'short'})).join(' · ')}</div>`:''})()}</div>`;
  // prossimo evento
  const ev=adm?[...DB.events].filter(x=>(x.end||x.start||'')>=oggi&&x.start).sort((a,b)=>a.start.localeCompare(b.start))[0]:null;
  const evCard=adm?`<div class="card evbig"${ev?` data-open="${ev.id}"`:''}><div class="eyebrow">🎛️ Prossimo evento</div>${ev?`<div class="row" style="align-items:flex-end;flex-wrap:nowrap"><div style="flex:1;min-width:0"><div class="t">${esc(ev.name||'Evento')}</div><div class="mut" style="margin-top:4px">${fmtD(ev.start)}${ev.end&&ev.end!==ev.start?' → '+fmtD(ev.end):''}${ev.place?' · '+esc(ev.place):''}</div><div style="margin-top:10px"><span class="tag ${status(ev).cls}">${status(ev).txt}</span></div></div><div style="text-align:right">${giorni(ev.start)>0?`<div class="count">${giorni(ev.start)}</div><div class="mut">giorni</div>`:'<span class="pill me">In corso</span>'}</div></div>`:'<p class="mut" style="margin:0">Nessun evento in programma.</p><button class="link" data-act="addEv" style="margin-top:8px">+ Crea evento</button>'}</div>`:'';
  // task
  const tasks=taskAperti();
  const tkCard=`<div class="card"><div class="eyebrow">✅ Task <span class="sp"></span><button class="link" data-gov="task">Tutti →</button></div>${tasks.slice(0,5).map(x=>`<div class="task"><input type="checkbox" data-atdone="${x.id}"><div style="flex:1;min-width:0"><div class="tt">${x.comune?'':'🔒 '}${esc(x.testo)}</div>${x.chi||x.scadenza?`<div class="mut">${x.chi?esc(x.chi):''}${x.chi&&x.scadenza?' · ':''}${x.scadenza?`<span class="${x.scadenza<oggi?'bad':''}">${new Date(x.scadenza+'T12:00').toLocaleDateString('it-IT',{day:'numeric',month:'short'})}</span>`:''}</div>`:''}</div></div>`).join('')||'<p class="mut" style="margin:0">Niente da fare 🎉</p>'}${tasks.length>5?`<div class="mut" style="margin-top:8px">+ altri ${tasks.length-5}</div>`:''}</div>`;
  return `<div class="hello"><h2>${saluto}, ${esc(me)}</h2><p style="text-transform:capitalize">${dataLunga}</p></div>
  <div class="hgrid"><div class="wide">${vCal()}</div><div class="side">${hero}${evCard}${tkCard}</div></div>`;
}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-gov]');if(!b)return;view=b.dataset.gov;curEv=null;rememberUI();render();scrollTo(0,0)});
/* ---------- Task e checklist ---------- */
let ATT=[];
window.CABPORT=window.CABPORT||{};
async function loadAtt(){if(!USER||!sb)return;const {data,error}=await sb.from('attivita').select('*').order('created_at');if(error){console.error(error);return}
  ATT=data||[];if(!curEv&&['calendario','task'].includes(view)&&!(document.activeElement&&document.activeElement.closest&&document.activeElement.closest('#app')))render()}
const taskAperti=()=>ATT.filter(x=>x.tipo==='task'&&!x.fatto).sort((a,b)=>(a.scadenza||'9').localeCompare(b.scadenza||'9'));
const puoiEliminare=x=>USER&&(x.user_id===USER.id||(x.comune&&isAdmin()));
const lucchetto=x=>x.comune?'':'<span class="pill" style="font-size:11px;padding:2px 8px">🔒 Solo tu</span> ';
function vTask(){
  const T=turni(), chi=[...T.persone,T.jolly].filter(Boolean), oggi=oggiS();
  const tasks=ATT.filter(x=>x.tipo==='task'), liste=ATT.filter(x=>x.tipo==='lista');
  const todo=taskAperti(), fatti=tasks.filter(x=>x.fatto);
  const vis=id=>`<select id="${id}"><option value="1">👥 Tutti</option><option value="0">🔒 Solo io</option></select>`;
  const row=x=>`<div class="task${x.fatto?' fatto':''}"><input type="checkbox" data-atdone="${x.id}" ${x.fatto?'checked':''}><div style="flex:1;min-width:0"><div class="tt">${esc(x.testo)}</div><div class="mut">${lucchetto(x)}${x.chi?`<span class="dav" style="background:${pcol(x.chi)};width:18px;height:18px;font-size:8px;vertical-align:middle">${esc(initials(x.chi))}</span> ${esc(x.chi)} `:''}${x.scadenza?`· 📅 ${fmtD(x.scadenza)}${!x.fatto&&x.scadenza<oggi?' <span class="bad">scaduto</span>':''}`:''}${x.autore&&x.comune?` <span style="opacity:.7">· creato da ${esc(first(x.autore))}</span>`:''}</div></div>${puoiEliminare(x)?`<button class="btn sec sm" data-atdel="${x.id}">✕</button>`:''}</div>`;
  let h=`<div class="card"><h2>✅ Task da fare</h2>
  <div class="grid"><div style="grid-column:span 2"><label>Cosa c'è da fare</label><input id="tTesto" placeholder="es. Comprare cavi Cat6"></div>
  <div><label>Chi</label><select id="tChi"><option value="">—</option>${chi.map(n=>`<option>${esc(n)}</option>`).join('')}</select></div>
  <div><label>Scadenza</label><input type="date" id="tData"></div>
  <div><label>Chi la vede</label>${vis('tVis')}</div>
  <div style="align-self:end"><button class="btn" data-atadd="task">+ Aggiungi</button></div></div>
  ${todo.map(row).join('')||'<p class="mut">Nessun task aperto 🎉</p>'}
  ${fatti.length?`<h3>Completati (${fatti.length})</h3>${fatti.slice(-10).reverse().map(row).join('')}${fatti.some(puoiEliminare)?'<button class="btn sec sm" data-atclear="1" style="margin-top:8px">Elimina completati</button>':''}`:''}</div>`;
  h+=`<div class="card"><h2>📋 To-do list</h2>
  <div class="grid"><div style="grid-column:span 2"><label>Nome della lista</label><input id="clNome" placeholder="es. Montaggio domenica"></div>
  <div><label>Chi la vede</label>${vis('clVis')}</div>
  <div style="align-self:end"><button class="btn" data-atadd="lista">+ Crea</button></div></div>
  <p class="mut">Liste riutilizzabili: spunta le voci e alla fine premi "Azzera".</p>
  ${liste.map(c=>{const v=c.voci||[], n=v.filter(q=>q.fatto).length;return `<div class="screen"><div class="row"><b style="flex:1">${esc(c.testo)}</b>${lucchetto(c)}<span class="tag ${n===v.length&&n?'ok':''}">${n}/${v.length}</span><button class="btn sec sm" data-atreset="${c.id}">Azzera</button>${puoiEliminare(c)?`<button class="btn bad sm" data-atdel="${c.id}">Elimina</button>`:''}</div>
    ${v.map((q,i)=>`<div class="task${q.fatto?' fatto':''}"><input type="checkbox" data-atvoce="${c.id}:${i}" ${q.fatto?'checked':''}><div class="tt" style="flex:1">${esc(q.testo)}</div><button class="btn sec sm" data-atvdel="${c.id}:${i}">✕</button></div>`).join('')}
    <div class="row" style="margin-top:8px"><input data-atnew="${c.id}" placeholder="Nuova voce (Invio per aggiungere)"></div></div>`}).join('')||'<p class="mut">Nessuna lista.</p>'}</div>`;
  return h;
}
async function attDo(q,ok){const {error}=await q;if(error){toast('Errore: '+error.message);return false}if(ok)toast(ok);await loadAtt();render();return true}
const attById=id=>ATT.find(x=>x.id===id);
document.addEventListener('click',async e=>{
  const a=e.target.closest&&e.target.closest('[data-atadd],[data-atdel],[data-atclear],[data-atreset],[data-atvdel]');if(!a||!USER)return;
  if(a.dataset.atadd==='task'){const testo=document.getElementById('tTesto').value.trim();if(!testo){toast('Scrivi cosa c\'è da fare');return}
    return attDo(sb.from('attivita').insert({tipo:'task',testo,chi:document.getElementById('tChi').value||null,scadenza:document.getElementById('tData').value||null,comune:document.getElementById('tVis').value==='1',autore:first(myName())}),'Task aggiunto ✓')}
  if(a.dataset.atadd==='lista'){const testo=document.getElementById('clNome').value.trim();if(!testo){toast('Dai un nome alla lista');return}
    return attDo(sb.from('attivita').insert({tipo:'lista',testo,comune:document.getElementById('clVis').value==='1',autore:first(myName())}),'Lista creata ✓')}
  if(a.dataset.atdel){const x=attById(a.dataset.atdel);if(!x)return;if(!await ask(`Eliminare "${x.testo}"?`))return;return attDo(sb.from('attivita').delete().eq('id',x.id),'Eliminato')}
  if(a.dataset.atclear){const ids=ATT.filter(x=>x.tipo==='task'&&x.fatto&&puoiEliminare(x)).map(x=>x.id);if(!ids.length)return;return attDo(sb.from('attivita').delete().in('id',ids),'Completati eliminati')}
  if(a.dataset.atreset){const c=attById(a.dataset.atreset);return attDo(sb.from('attivita').update({voci:(c.voci||[]).map(v=>({...v,fatto:false}))}).eq('id',c.id))}
  if(a.dataset.atvdel){const [id,i]=a.dataset.atvdel.split(':');const c=attById(id);const v=[...(c.voci||[])];v.splice(+i,1);return attDo(sb.from('attivita').update({voci:v}).eq('id',id))}
});
document.addEventListener('change',async e=>{const t=e.target;if(!USER||!t.dataset)return;
  if(t.dataset.atdone){const x=attById(t.dataset.atdone);x.fatto=t.checked;return attDo(sb.from('attivita').update({fatto:t.checked}).eq('id',x.id))}
  if(t.dataset.atvoce){const [id,i]=t.dataset.atvoce.split(':');const c=attById(id);const v=(c.voci||[]).map(q=>({...q}));v[+i].fatto=t.checked;return attDo(sb.from('attivita').update({voci:v}).eq('id',id))}
  if(t.dataset.atnew){const testo=t.value.trim();if(!testo)return;const id=t.dataset.atnew;const c=attById(id);
    if(await attDo(sb.from('attivita').update({voci:[...(c.voci||[]),{testo,fatto:false}]}).eq('id',id)))setTimeout(()=>{const n=document.querySelector(`[data-atnew="${id}"]`);n&&n.focus()},0)}
});

/* ---------- Widget iPhone ---------- */
const FEED_BASE='https://rliekssnvssbpkjzpash.supabase.co/functions/v1/feed';
const SITO_URL='https://ledwall-visuals.github.io/';
let FEEDTOK=null;
let MIOTOK=null;
async function loadTok(){if(!USER||(FEEDTOK&&MIOTOK))return;const {data}=await sb.from('feed_token').select('token').eq('id',1).maybeSingle();if(data)FEEDTOK=data.token;
  let {data:m}=await sb.from('token_personale').select('token').maybeSingle();
  if(!m){const r=await sb.from('token_personale').insert({}).select('token').single();m=r.data}
  if(m)MIOTOK=m.token; if(FEEDTOK&&view==='backup')render()}
function scriptable(){return `// Gestionale Ledwall – widget per Scriptable (si aggiorna da solo)
// Parametro del widget: calendario | task | todo | todo:Nome lista
const FEED_TOKEN = "${FEEDTOK}";
const SOLO_TURNI = ${!isAdmin()};
const IO = "${esc(first(myName()))}";
const MIO = "${MIOTOK||''}";
const CODE_URL = "https://api.github.com/repos/Ledwall-visuals/ledwall-visuals.github.io/contents/widget.js";
const fm = FileManager.local(), f = fm.joinPath(fm.documentsDirectory(), "ledwall-widget.js");
let code;
try { const rq = new Request(CODE_URL); rq.headers = { Accept: "application/vnd.github.raw" }; code = await rq.loadString(); if (!code.includes("ListWidget")) throw 0; fm.writeString(f, code); }
catch (e) { code = fm.fileExists(f) ? fm.readString(f) : ""; }
await eval("(async () => {" + code + "\\n})()");
Script.complete();
`}
function vWidget(){
  loadTok();
  if(!FEEDTOK||!MIOTOK)return `<div class="card"><h2>📱 Widget iPhone</h2><p class="mut">Caricamento…</p></div>`;
  const jolly=isMe(turni().jolly);
  const adm=isAdmin(), ics=FEED_BASE.replace('https://','webcal://')+'?t='+FEEDTOK+(adm?'':'&solo=turni'), icsMe=jolly?ics:ics+'&p='+encodeURIComponent(first(myName()));
  return `<div class="card"><h2>📱 Widget iPhone</h2>
  <h3>1. Calendario (widget Calendario di Apple)</h3>
  <p class="mut">Tocca il pulsante e conferma "Iscriviti": nel Calendario dell'iPhone compaiono ${adm?'gli eventi, ':''}${jolly?'<b>tutti i turni</b> (sei il jolly)':`<b>solo i tuoi turni</b> (come ${esc(first(myName()))})`}${adm?' e i tuoi task con scadenza':''}, e si aggiornano da soli. Poi aggiungi alla Home il widget <b>Calendario</b> di Apple. Il nome deve corrispondere a quello nei turni: lo cambi da 👤 Profilo.</p>
  <div class="row"><a class="btn" href="${icsMe}" style="text-decoration:none">📅 Iscriviti al calendario</a><button class="btn sec" data-act="copyIcs">Copia il mio link</button></div>
  <h3>2. Widget personalizzato (calendario, task o to-do list)</h3>
  <p class="mut">Installa l'app gratuita <b>Scriptable</b> dall'App Store. Tocca "Copia script", apri Scriptable, tocca <b>+</b>, incolla e chiamalo "Ledwall". Poi sulla Home: tieni premuto → <b>+</b> → Scriptable → scegli la misura → tocca il widget → Script: <b>Ledwall</b> → Parameter: <b>calendario</b>, <b>task</b> oppure <b>todo</b> (o <b>todo:Nome lista</b> per una lista precisa). Puoi mettere più widget con parametri diversi, tutti con lo stesso script. Nei widget vedi le cose comuni e anche le tue 🔒 personali.</p>
  <div class="row"><button class="btn" data-act="copyScript">📋 Copia script</button></div>
  <p class="mut">⚠️ Questi link contengono una chiave privata: non condividerli fuori dal team.</p></div>`;
}
async function copia(t,msg){try{await navigator.clipboard.writeText(t);toast(msg)}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast(msg)}catch(_){toast('Copia non riuscita')}ta.remove()}}
/* ---------- Backup ---------- */
function gi(ic,col,txt,attr){return `<button class="gi" ${attr}><span class="ic" style="background:${col}">${ic}</span><span class="gt">${txt}<span class="sp"></span><span class="chev">›</span></span></button>`}
function vBackup(){
  return `<div class="hello"><h2>Altro</h2></div>
  <div class="glist">${gi('📦','#ff9f0a','Inventario','data-gov="inventario"')}${gi('🚫','#ff453a','Assenze','data-gov="assenze"')}${gi('🕘','#5e5ce6','Registro modifiche','data-gov="registro"')}</div>
  <div class="ghead">Permessi</div>
  <div class="glist">${gi('👁','#30d158','Vedi il sito come gli altri','data-ante="1"')}</div>
  <p class="mut" style="margin:-14px 16px 22px;font-size:13px">Lucas, Matteo ed Edo vedono il calendario dei turni, l'inventario in sola lettura, le assenze e il widget. Tu e Sebi vedete e modificate tutto.</p>`+vWidget()+`<div class="card"><h2>Backup dati</h2>
  <p class="mut">I dati sono sincronizzati online sul tuo account. Puoi comunque esportare un backup (file .json) per sicurezza.</p>
  <div class="row"><button class="btn" data-act="export">⬇️ Esporta backup</button>
  <label class="btn sec" style="margin:0;color:var(--txt);font-size:15px">⬆️ Importa backup<input type="file" id="imp" accept=".json" hidden></label>
  <span class="sp"></span><button class="btn bad" data-act="reset">Ripristina dati di esempio</button></div></div>`;
}

/* ===================== EVENTI UI ===================== */
function bind(){
  const app=document.getElementById('app');
  app.onclick=async e=>{
    const o=e.target.closest('[data-open]'); if(o){curEv=o.dataset.open;rememberUI();render();return}
    const a=e.target.closest('[data-act]'); if(!a)return; const act=a.dataset.act;
    const ev=curEv&&DB.events.find(x=>x.id===curEv);
    const A={
      addItem(){const cat=document.getElementById('newCat').value; const it={id:uid(),cat,name:'Nuovo articolo',qty:0,autoPer:'none',autoQty:0,note:''};
        if(cat==='led')Object.assign(it,{name:'Nuovo modulo LED',modPerCase:6,modW:500,modH:1000,pxW:192,pxH:384,kg:7.5,watt:180});
        stamp(it);DB.items.unshift(it);logChange(`Aggiunto articolo in ${CATS[cat]}`)},
      async delItem(){const it=item(a.dataset.id);if(await ask('Eliminare questo articolo?')){DB.items=DB.items.filter(i=>i.id!==a.dataset.id);logChange(`Eliminato articolo "${it&&it.name}"`)}else return 'nosave'},
      addEv(){const t=new Date().toISOString().slice(0,10);const n={id:uid(),name:'Nuovo evento',place:'',start:t,end:'',screens:[],extras:[],checked:{}};stamp(n);DB.events.push(n);curEv=n.id;logChange('Creato un nuovo evento')},
      back(){curEv=null;view='eventi';rememberUI();render();return 'nosave'},
      async delEv(){if(await ask('Eliminare l\'evento?')){logChange(`Eliminato evento "${ev.name}"`);DB.events=DB.events.filter(x=>x.id!==curEv);curEv=null}else return 'nosave'},
      dupEv(){const c=JSON.parse(JSON.stringify(ev));c.id=uid();c.name+=' (copia)';c.checked={};stamp(c);DB.events.push(c);curEv=c.id;logChange(`Duplicato evento "${ev.name}"`)},
      addScreen(){const l=DB.items.find(i=>i.cat==='led');ev.screens.push({name:'Schermo '+(ev.screens.length+1),ledId:l?.id,mode:'moduli',w:3,h:2});stamp(ev);logChange(`Evento "${ev.name}": aggiunto schermo`)},
      delScreen(){const sc=ev.screens[+a.dataset.i];ev.screens.splice(+a.dataset.i,1);stamp(ev);logChange(`Evento "${ev.name}": rimosso ${sc&&sc.name}`)},
      addExtra(){ev.extras=ev.extras||[];const x={itemId:document.getElementById('extraSel').value,qty:+document.getElementById('extraQty').value||1};ev.extras.push(x);stamp(ev);logChange(`Evento "${ev.name}": aggiunto a mano ${x.qty} × ${item(x.itemId)?.name}`)},
      delExtra(){const x=ev.extras[+a.dataset.i];ev.extras.splice(+a.dataset.i,1);stamp(ev);logChange(`Evento "${ev.name}": tolto ${x&&item(x.itemId)?.name}`)},
      async export(){const data=JSON.stringify(DB,null,2), filename='backup-gestionale-'+new Date().toISOString().slice(0,10)+'.json';
        let dl=null; try{if(window.claude&&window.claude.use)dl=await window.claude.use('downloads')}catch(_){}
        if(dl){try{await dl.save({filename,data});toast('Backup salvato')}catch(_){toast('Download annullato')}}
        else{const b=new Blob([data],{type:'application/json'});const u=document.createElement('a');u.href=URL.createObjectURL(b);u.download=filename;u.click()}
        return 'nosave'},
      copyIcs(){copia(FEED_BASE+'?t='+FEEDTOK+(isAdmin()?'':'&solo=turni')+(isMe(turni().jolly)?'':'&p='+encodeURIComponent(first(myName()))),'Link calendario copiato');return 'nosave'},
      copyScript(){copia(scriptable(),'Script copiato: ora aprilo in Scriptable');return 'nosave'},
      moreTurni(){window.TMORE=true;render();return 'nosave'},
      toggleTset(){window.TSET=!window.TSET;render();return 'nosave'},
      async reset(){if(await ask('Cancellare tutto e ripristinare i dati di esempio? Vale per tutti gli utenti.')){DB=seed();logChange('Ripristinati i dati di esempio (tutto cancellato)')}else return 'nosave'},
    };
    if(A[act]){ if(act==='delExtra')e.preventDefault(); const r=await A[act](); if(r!=='nosave'){save();render()} }
  };
  app.onchange=e=>{
    const t=e.target, ev=curEv&&DB.events.find(x=>x.id===curEv);
    if(t.id==='logq'){window.LOGQUERY=t.value;render();return}
    if(t.dataset.turno){const T=turni();const [ds,sl]=t.dataset.turno.split(':');const k=ds+':'+sl;const old=turno(ds,+sl);
      if(t.value==='__auto')delete T.override[k];else T.override[k]=t.value;
      logChange(`Turno ${T.slot[+sl]} di ${fmtD(ds)}: ${old||'nessuno'} → ${turno(ds,+sl)||'nessuno'}`);save();render();return}
    if(t.dataset.tset){const T=turni();const f=t.dataset.tset;
      if(f==='persone')T.persone=t.value.split('\n').map(x=>x.trim()).filter(Boolean);
      else if(f==='slot0')T.slot[0]=t.value;else if(f==='slot1')T.slot[1]=t.value;else T[f]=t.value;
      logChange(`Turni: modificate le impostazioni (${t.parentElement.querySelector('label').textContent})`);save();render();return}
    const lab=()=>{const l=t.parentElement&&t.parentElement.querySelector('label');return l?l.textContent:''};
    const show=(f,v)=>{if(f==='ledId')return item(v)?.name||v;if(f==='autoPer')return PER[v]||v;return v===''||v==null?'(vuoto)':v};
    if(t.id==='imp'){const f=t.files[0];if(!f)return;f.text().then(s=>{try{const d=JSON.parse(s);if(!d.items)throw 0;DB=d;logChange('Importato un backup (sostituiti tutti i dati)');save();toast('Backup importato');render()}catch(_){toast('File non valido')}});return}
    if(t.id==='scorta'){const old=DB.settings.scorta;DB.settings.scorta=+t.value||0;logChange(`Scorta moduli: ${old}% → ${DB.settings.scorta}%`)}
    else if(t.dataset.f){const it=item(t.closest('[data-item]').dataset.item); const old=it[t.dataset.f]; it[t.dataset.f]=t.type==='number'?+t.value:t.value; stamp(it);
      logChange(t.dataset.f==='name'?`Inventario: rinominato "${old}" → "${it.name}"`:`Inventario "${it.name}": ${lab()} ${show(t.dataset.f,old)} → ${show(t.dataset.f,it[t.dataset.f])}`)}
    else if(t.dataset.ef){const old=ev[t.dataset.ef]; ev[t.dataset.ef]=t.value; if(t.dataset.ef==='end'&&t.value&&t.value<ev.start){ev.end=ev.start} stamp(ev);
      logChange(t.dataset.ef==='name'?`Evento rinominato "${old}" → "${ev.name}"`:t.dataset.ef==='notes'?`Evento "${ev.name}": modificate le note`:`Evento "${ev.name}": ${lab()} ${show('',old)} → ${show('',ev[t.dataset.ef])}`)}
    else if(t.dataset.sf){const s=ev.screens[+t.closest('[data-scr]').dataset.scr]; const old=s[t.dataset.sf]; s[t.dataset.sf]=t.type==='number'?+t.value:t.value; stamp(ev);
      logChange(`Evento "${ev.name}", ${s.name}: ${lab()} ${show(t.dataset.sf,old)} → ${show(t.dataset.sf,s[t.dataset.sf])}`)}
    else if(t.dataset.chk){ev.checked=ev.checked||{};ev.checked[t.dataset.chk]=t.checked; logChange(`Evento "${ev.name}": ${t.checked?'caricato ✓':'tolta la spunta a'} "${item(t.dataset.chk)?.name}"`)}
    else return;
    save(); render();
  };
}
start();
