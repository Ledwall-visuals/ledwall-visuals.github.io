<script id="appjs">
/* ===================== DATI ===================== */
const KEY='gestionale-ledwall-v1';
const CATS={led:'Casse LED',processore:'Processori / Controller',cavo:'Cavi',struttura:'Strutture / Appendimento',audio:'Audio / Video',altro:'Altro'};
const PER={none:'—',modulo:'per modulo',colonna:'per colonna',fila:'per fila',cassa:'per cassa LED',schermo:'per schermo',evento:'per evento'};
const uid=()=>Math.random().toString(36).slice(2,10);

function seed(){
  const led=uid();
  return {
    settings:{scorta:5},
    items:[
      {id:led,cat:'led',name:'Modulo P2.6 192x384 (cassa da 6)',qty:20,modPerCase:6,modW:500,modH:1000,pxW:192,pxH:384,kg:7.5,watt:180,autoPer:'none',autoQty:0,note:'Esempio: correggi misure, moduli per cassa e quantità'},
      {id:uid(),cat:'processore',name:'Processore video (es. Novastar)',qty:2,autoPer:'schermo',autoQty:1,maxPx:2300000,note:'maxPx = pixel gestibili'},
      {id:uid(),cat:'cavo',name:'Cavo alimentazione modulo-modulo',qty:150,autoPer:'modulo',autoQty:1,note:''},
      {id:uid(),cat:'cavo',name:'Cavo rete dati (RJ45) modulo-modulo',qty:150,autoPer:'modulo',autoQty:1,note:''},
      {id:uid(),cat:'cavo',name:'Cavo powerCON / Schuko alimentazione colonna',qty:40,autoPer:'colonna',autoQty:1,note:''},
      {id:uid(),cat:'cavo',name:'Cavo Cat6 lungo (processore → schermo) 30m',qty:8,autoPer:'schermo',autoQty:2,note:''},
      {id:uid(),cat:'struttura',name:'Barra di appendimento 1m',qty:20,autoPer:'colonna',autoQty:1,note:'1 per colonna (modulo 500mm → 1 barra ogni 2 colonne? correggi)'},
      {id:uid(),cat:'altro',name:'Multipresa / quadretto elettrico',qty:4,autoPer:'schermo',autoQty:1,note:''},
    ],
    events:[]
  };
}
const CFG=window.CONFIG||{};
let sb=null; try{if(CFG.SUPABASE_URL&&!/INCOLLA/.test(CFG.SUPABASE_URL))sb=supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_KEY)}catch(e){console.error(e)}
function localLoad(){try{const d=JSON.parse(localStorage.getItem(KEY));return d&&d.items?d:null}catch(e){return null}}
let DB=localLoad()||seed();
const IN_FRAME=false;
let pubTimer=null, dirty=false, USER=null;
// Ruoli: admin (Benni, Sebi) vedono e modificano tutto; gli altri vedono calendario turni e inventario in sola lettura.
// Il ruolo è in app_metadata.ruolo (impostabile solo dal server); il database blocca le modifiche dei non admin.
let ANTEPRIMA=false; try{ANTEPRIMA=sessionStorage.getItem(KEY+'-ante')==='1'}catch(e){}
function realAdmin(){return !!(USER&&USER.app_metadata&&USER.app_metadata.ruolo==='admin')}
function isAdmin(){return realAdmin()&&!ANTEPRIMA}
// la configurazione della chiesa la modifica solo Benni
const CHIESA_OWNER='921401e3-d2f3-4362-9e6b-869f88d468ae';function chiesaOwner(){return !!(USER&&USER.id===CHIESA_OWNER&&!ANTEPRIMA)}
const VISTE_UTENTE=['chiesa','calendario','task','inventario','assenze','backup'];
function setSt(t){const e=document.getElementById('saveSt');if(e)e.textContent=t}
function save(){
  if(USER&&!isAdmin()){toast('Sola lettura');return}
  DB._t=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}
  try{sessionStorage.setItem(KEY+'-ui',JSON.stringify({view,curEv}))}catch(e){}
  if(USER){dirty=true;setSt('Salvataggio…');clearTimeout(pubTimer);pubTimer=setTimeout(push,1000)}
}
// Dati condivisi tra tutti gli utenti: una sola riga 'main' nella tabella 'condiviso'
let BASE_T=null; // _t della versione online su cui stiamo lavorando
async function remote(){const {data,error}=await sb.from('condiviso').select('data').eq('id','main').maybeSingle();if(error)throw error;return data&&data.data}
async function push(){
  if(!USER||!dirty)return; dirty=false;
  try{
    const r=await remote();
    if(r&&r.items&&BASE_T!==null&&(r._t||0)>BASE_T){ // qualcun altro ha salvato nel frattempo
      LOGQ=[];DB=r;BASE_T=r._t||0;try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){};render();
      toast('Un altro utente ha modificato i dati: ho caricato la versione aggiornata, ripeti la tua ultima modifica');setSt('Sincronizzato ✓');return}
    const {error}=await sb.from('condiviso').upsert({id:'main',data:DB,updated_at:new Date().toISOString(),updated_by:USER.id});
    if(error)throw error; BASE_T=DB._t; setSt('Salvato ✓'); flushLog();
  }catch(e){dirty=true;setSt('⚠️ Non salvato online');console.error(e)}
}
async function pull(){
  if(!USER||dirty)return;
  let r; try{r=await remote()}catch(e){setSt('⚠️ Offline: salvo sul dispositivo');console.error(e);return}
  if(r&&r.items){ if(BASE_T===null||(r._t||0)!==BASE_T||(r._t||0)!==(DB._t||0)){const ui=document.activeElement&&document.activeElement.closest&&document.activeElement.closest('#app');DB=r;BASE_T=r._t||0;try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){};if(!ui)render()} setSt('Sincronizzato ✓')}
  else if(realAdmin()){BASE_T=DB._t||0;dirty=true;await push()}

// Distributore (Botex PSA 321): ingresso CEE 32 A trifase (3 × 32 A × 230 V), 6 prese Schuko da 16 A (2 per fase). Carico tenuto all'80%.
function psa(watt){return Math.max(1,Math.ceil(watt/(3*32*230*0.8)))}
function offSet(s,cols,rows){const o=new Set();(s.off||[]).forEach(x=>{const [k,r]=x.split(',').map(Number);if(k<cols&&r<rows)o.add(k+','+r)});return o}
function screenCalc(s){
  const it=item(s.ledId); if(!it) return null;
  let cols,rows;
  if(s.mode==='metri'){cols=Math.ceil((+s.w*1000)/it.modW-1e-9);rows=Math.ceil((+s.h*1000)/it.modH-1e-9)}
  else{cols=Math.max(0,Math.round(+s.w));rows=Math.max(0,Math.round(+s.h))}
  const off=offSet(s,cols,rows), mods=cols*rows-off.size;
  const scorta=Math.ceil(mods*(+DB.settings.scorta||0)/100);
  const modsTot=mods+scorta;
  const cases=Math.ceil(modsTot/it.modPerCase);
  return {it,off,cols,rows,mods,scorta,modsTot,cases,
    leftover:cases*it.modPerCase-modsTot,
    pxW:cols*it.pxW,pxH:rows*it.pxH,
    mW:cols*it.modW/1000,mH:rows*it.modH/1000,
    kg:mods*(+it.kg||0),watt:mods*(+it.watt||0)};
}
function overlap(a,b){return a.start<= (b.end||b.start) && b.start <= (a.end||a.start)}
function usedElsewhere(ev,itemId){
  // massimo impegno dello stesso materiale da altri eventi che si sovrappongono
  let used=0;
  DB.events.forEach(o=>{ if(o.id===ev.id||!ev.start||!o.start||!overlap(ev,o))return;
    const n=needs(o)[itemId]; if(n) used+=n.qty; });
  return used;
}
function needs(ev){
  const need={}; const add=(id,q,why)=>{ if(!q)return; need[id]=need[id]||{qty:0,why:[]}; need[id].qty+=q; need[id].why.push(why)};
  const calcs=(ev.screens||[]).map(screenCalc).filter(Boolean);
  let totMods=0,totCols=0,totRows=0,totCases=0;
  calcs.forEach((c,i)=>{const nm=ev.screens[i].name||('Schermo '+(i+1));
    add(c.it.id,c.cases,`${nm}: ${c.modsTot} moduli → ${c.cases} casse`);
    totMods+=c.mods;totCols+=c.cols;totRows+=c.rows;totCases+=c.cases;});
  DB.items.forEach(it=>{ if(!it.autoPer||it.autoPer==='none'||!(+it.autoQty))return; const q=+it.autoQty;
    if(it.autoPer==='modulo') add(it.id,Math.ceil(q*totMods),`${q} × ${totMods} moduli`);
    if(it.autoPer==='colonna') add(it.id,Math.ceil(q*totCols),`${q} × ${totCols} colonne`);
    if(it.autoPer==='fila') add(it.id,Math.ceil(q*totRows),`${q} × ${totRows} file`);
    if(it.autoPer==='cassa') add(it.id,Math.ceil(q*totCases),`${q} × ${totCases} casse`);
    if(it.autoPer==='schermo' && calcs.length){
      if(it.cat==='processore' && +it.maxPx){ let n=0; calcs.forEach(c=>n+=Math.max(1,Math.ceil(c.pxW*c.pxH/+it.maxPx))*q); add(it.id,n,`in base ai pixel (max ${(+it.maxPx).toLocaleString('it-IT')} px)`); }
      else add(it.id,Math.ceil(q*calcs.length),`${q} × ${calcs.length} schermi`);
    }
    if(it.autoPer==='evento') add(it.id,Math.ceil(q),'fisso per evento');
  });
  (ev.extras||[]).forEach(x=>add(x.itemId,+x.qty,'aggiunto a mano'));
  return need;
}

function status(ev){
  const n=needs(ev); let miss=0;
  Object.entries(n).forEach(([id,x])=>{const it=item(id); if(it && x.qty>it.qty-usedElsewhere(ev,id)) miss++});
  if(!Object.keys(n).length) return {cls:'',txt:'Da compilare'};
  return miss?{cls:'bad',txt:`${miss} mancanti`}:{cls:'ok',txt:'Materiale OK'};
}

  // ===== SINISTRA: crea / modifica schermo =====
  let L=`<div class="card"><div class="row"><h2 style="margin:0">${s?'✏️ Schermo':'Schermi'}</h2><span class="sp"></span><button class="btn noprint" data-act="addScreen">+ Nuovo</button></div>`;
  if(s&&window.SCREDIT!==false){L+=`<div class="seg noprint"><button class="${s.mode!=='metri'?'on':''}" data-unita="${i}:moduli">Moduli</button><button class="${s.mode==='metri'?'on':''}" data-unita="${i}:metri">Metri</button></div>
    <div class="grid" data-scr="${i}" style="grid-template-columns:1fr 1fr;margin-top:10px"><div style="grid-column:span 2"><label>Nome</label><input data-sf="name" value="${esc(s.name)}"></div>
      <div style="grid-column:span 2"><label>Tipo LED</label><select data-sf="ledId">${leds.map(l=>`<option value="${l.id}" ${s.ledId===l.id?'selected':''}>${esc(l.name)}</option>`).join('')}</select></div>
      <div><label>Larghezza (${s.mode==='metri'?'m':'moduli'})</label><input type="number" step="${s.mode==='metri'?0.5:1}" min="0" data-sf="w" value="${s.w}"></div>
      <div><label>Altezza (${s.mode==='metri'?'m':'moduli'})</label><input type="number" step="1" min="0" data-sf="h" value="${s.h}"></div>
      </div>${s.mode==='metri'?'<p class="mut" style="margin:10px 0 6px">In metri si arrotonda per eccesso al modulo intero.</p>':''}
    <div class="row noprint" style="margin-top:8px"><button class="btn sm" data-scrclose="1">✓ Salva</button><span class="sp"></span><button class="btn bad sm" data-act="delScreen" data-i="${i}">Rimuovi</button></div>`}
  else L+=`<p class="mut">${s?'Tocca uno schermo nella lista per modificarlo, oppure ':'Premi '}<b>+ Nuovo</b> per crearne uno.</p>`;
  L+=`<p class="mut" style="margin-top:12px">Scorta moduli di riserva: <input type="number" min="0" id="scorta" value="${DB.settings.scorta}" style="width:70px;display:inline-block"> %</p></div>`;

  // ===== CENTRO: dati evento, schermi creati, info, pixelmap e cablaggio =====
  const DATI=`<div class="card" data-ev="${ev.id}"><div class="row"><h2 style="margin:0">Dati evento</h2><span class="sp"></span><button class="btn noprint" data-evdati="0">✓ Fatto, vai agli schermi</button></div>${byLine(ev)}<div class="grid">
    <div style="grid-column:span 2"><label>Nome</label><input data-ef="name" value="${esc(ev.name)}"></div>
    <div style="grid-column:span 2"><label>Luogo</label><input data-ef="place" value="${esc(ev.place)}"></div>
    <div><label>Dal</label><input type="date" data-ef="start" value="${ev.start||''}"></div>
    <div><label>Al (vuoto = 1 giorno)</label><input type="date" data-ef="end" value="${ev.end||''}"></div>
    <div><label>Montaggio (data/ora)</label><input type="datetime-local" data-ef="setup" value="${ev.setup||''}"></div>
    <div><label>Smontaggio (data/ora)</label><input type="datetime-local" data-ef="teardown" value="${ev.teardown||''}"></div>
    <div style="grid-column:1/-1"><label>Note (referente, orari, accesso, corrente disponibile...)</label><textarea data-ef="notes">${esc(ev.notes)}</textarea></div>
  </div></div>`;
  if(dati)return h+`<div class="evl">${topL}</div><div class="evc">${DATI}</div><div class="evr">${topR}</div></div>`;
  let C=`<div class="card"><div class="row" style="flex-wrap:nowrap"><div style="flex:1;min-width:0"><h2 style="margin:0">${esc(ev.name||'Evento')}</h2><div class="mut">${[ev.place,ev.start?fmtD(ev.start)+(ev.end&&ev.end!==ev.start?' → '+fmtD(ev.end):''):''].filter(Boolean).map(esc).join(' · ')}</div></div><button class="btn sec sm noprint" data-evdati="1">✏️ Dati evento</button></div></div>`;
  L+=`<div class="card scrlist"><h2>Schermi dell'evento</h2>`;
  if(!(ev.screens||[]).length)L+=`<p class="mut">Nessuno schermo: crealo qui sopra.</p>`;
  (ev.screens||[]).forEach((x,k)=>{L+=`<div class="screen scrrow" data-scropen="${k}" style="${k===i?'border:1px solid var(--acc)':''}"><div class="row" style="flex-wrap:nowrap"><b style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.name||'Schermo')}</b><span class="mut">${k===i?'●':'›'}</span></div></div>`});
  L+=`</div>`;
  if((ev.screens||[]).length>1||ev.id==='chiesa')C+=pmAllCard(ev);
  if(s){C+=`<div class="card" data-scr="${i}"><h2>${esc(s.name||'Schermo')}</h2>`;
    let h='';
    if(c){ h+=`<div class="kpi kpi6">
      <div><b>${c.cols} × ${c.rows}</b><span>moduli (col × file)</span></div>
      <div><b>${c.cases}</b><span>casse da ${c.it.modPerCase} (${c.mods} moduli${c.scorta?` + ${c.scorta} scorta`:''}${c.leftover?`, ${c.leftover} posti liberi`:''})</span></div>
      <div><b>${c.mW.toFixed(2)} × ${c.mH.toFixed(2)} m</b><span>misura reale</span></div>
      <div><b>${c.pxW} × ${c.pxH}</b><span>risoluzione px (${(c.pxW*c.pxH/1e6).toFixed(2)} MP)</span></div>
      <div><b>${c.kg.toFixed(0)} kg</b><span>peso moduli</span></div>
      <div><b>${(c.watt/1000).toFixed(1)} kW</b><span>consumo max · ~${Math.ceil(c.watt/(Math.sqrt(3)*400))} A/fase${c.watt?` · ${psa(c.watt)} distrib.`:''}</span></div></div>`;
      h+=`<div class="pmbox">${(()=>{const k=Math.min(900/Math.max(1,c.pxW),340/Math.max(1,c.pxH)),dw=Math.round(c.pxW*k),dh=Math.round(c.pxH*k);return `<canvas class="pm" data-pm="${i}" width="${dw*2}" height="${dh*2}" style="width:${dw}px${(s.cabOn==='1'&&s.cabMode==='man')||s.cabOn==='3'||s.cabOn==='4'?';touch-action:none;cursor:'+(s.cabOn==='4'?'move':'crosshair'):''}"></canvas>`})()}
      <div class="row noprint" style="margin-top:8px"><b style="flex:1">🎯 Pixelmap ${c.pxW} × ${c.pxH}</b><button class="btn sm" data-pmvid="${i}">🎬 Scarica video loop</button><button class="btn sec sm" data-pmpng="${i}">🖼 PNG</button></div>
      <div class="grid noprint" style="margin-top:8px"><div><label>Vista</label><select data-sf="cabOn"><option value="">🎯 Pixelmap</option><option value="1" ${s.cabOn==='1'?'selected':''}>🔌 Cablaggio dati</option><option value="2" ${s.cabOn==='2'?'selected':''}>⚡ Corrente</option><option value="3" ${s.cabOn==='3'?'selected':''}>✂️ Forma</option><option value="4" ${s.cabOn==='4'?'selected':''}>📐 Zona MAIN</option></select></div>
      ${s.cabOn==='3'?`<div style="grid-column:1/-1"><p class="mut" style="margin:0 0 6px">Tocca (o trascina sopra) i moduli per toglierli o rimetterli, oppure scegli da che colonna a che colonna va ogni fila.</p>
        ${[...Array(c.rows)].map((_,r)=>{let a=-1,b=-1;for(let k=0;k<c.cols;k++)if(!c.off.has(k+','+r)){if(a<0)a=k;b=k}return `<div class="row" style="gap:8px;margin:4px 0;flex-wrap:nowrap"><b style="width:60px">Fila ${r+1}</b><span class="mut">da colonna</span><input type="number" min="1" max="${c.cols}" step="1" data-forma="${i}:${r}:a" value="${a<0?'':a+1}" style="width:80px"><span class="mut">a</span><input type="number" min="1" max="${c.cols}" step="1" data-forma="${i}:${r}:b" value="${b<0?'':b+1}" style="width:80px"><span class="mut">${b<0?0:[...Array(c.cols)].filter((_,k)=>!c.off.has(k+','+r)).length} moduli</span></div>`}).join('')}
        <button class="btn sec sm" data-formaall="${i}" style="margin-top:6px">Accendi tutto</button></div>`:''}
      ${s.cabOn==='4'?(()=>{const z=pmMainZone(c,s,pmGeometry(c));return `<div style="grid-column:1/-1"><p class="mut" style="margin:0 0 8px">Trascina il rettangolo viola per spostare MAIN; trascina gli angoli per ridimensionarlo. La scritta segue sempre il centro. La cornice viola non compare nelle esportazioni.</p><div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr))">${[['x','Posizione X',z.x],['y','Posizione Y',z.y],['w','Larghezza',z.w],['h','Altezza',z.h]].map(([key,label,value])=>`<div><label>${label} (px)</label><input type="number" min="0" step="1" data-pmzone="${i}:${key}" value="${Math.round(value)}"></div>`).join('')}</div><button class="btn sec sm" data-pmzonereset="${i}" style="margin-top:10px">↺ Ripristina posizione MAIN</button></div>`})():''}
      ${s.cabOn==='2'?(()=>{const pp=powPlan(c,s),w=+c.it.watt||0;if(!w)return `<div style="grid-column:1/-1" class="bad">Manca il consumo del modulo nell'inventario.</div>`;
        return `<div><label>Partenza</label><select data-sf="cabStart">${[['BL','In basso a sinistra'],['BR','In basso a destra'],['TL','In alto a sinistra'],['TR','In alto a destra']].map(([v,l])=>`<option value="${v}" ${(s.cabStart||'BL')===v?'selected':''}>${l}</option>`).join('')}</select></div>
        <div><label>Direzione</label><select data-sf="cabDir"><option value="col" ${(s.cabDir||'col')==='col'?'selected':''}>Per colonne ↕</option><option value="row" ${s.cabDir==='row'?'selected':''}>Per file ↔</option></select></div>
        <div style="grid-column:1/-1"><p class="mut" style="margin:0 0 6px">Distributore: 32 A trifase, 6 prese da 16 A (2 per fase). Max ${pp.mpo} moduli per presa (16 A all'80%). Le fasi sono alternate per bilanciare il carico.</p>
        ${[...Array(pp.dist)].map((_,d)=>`<div class="screen" style="margin:6px 0"><b>⚡ Distributore ${d+1}</b> <span class="mut">· L1 ${(pp.fasi[d][0]/230).toFixed(1)} A · L2 ${(pp.fasi[d][1]/230).toFixed(1)} A · L3 ${(pp.fasi[d][2]/230).toFixed(1)} A</span>
          ${pp.info.filter(x=>x.d===d+1).sort((a,b)=>a.ph-b.ph||a.pr-b.pr).map(x=>`<div class="task" style="padding:6px 0"><span class="dav" style="background:${FASE_COL[x.ph-1]};margin:0;color:#000">L${x.ph}</span><div style="flex:1">Presa ${x.pr} · <b>${x.n} moduli</b></div><span class="mut">${(x.w/1000).toFixed(2)} kW · ${(x.w/230).toFixed(1)} A</span></div>`).join('')}</div>`).join('')}</div>`})():''}
      ${s.cabOn==='1'?(()=>{const cp=cabPlan(c,s);return `<div><label>Modo</label><select data-sf="cabMode"><option value="">Automatico</option><option value="man" ${s.cabMode==='man'?'selected':''}>✋ A mano</option></select></div>
      ${s.cabMode==='man'?`<div style="grid-column:1/-1"><div class="row" style="gap:6px">${((s.cabMan&&s.cabMan.ports)||[[]]).map((ch,p)=>`<button class="btn sm ${(CABPORT[i]||0)===p?'':'sec'}" data-cabport="${i}:${p}" style="${(CABPORT[i]||0)===p?`background:${CAB_COL[p%CAB_COL.length]};color:#000`:''}">P${p+1} · ${ch.length}</button>`).join('')}<button class="btn sec sm" data-cabadd="${i}">＋ Porta</button><span class="sp"></span><button class="btn sec sm" data-cabundo="${i}">↩︎ Annulla</button><button class="btn sec sm" data-cabclr="${i}">Svuota porta</button><button class="btn sec sm" data-cabcopy="${i}">Parti dall'automatico</button><button class="btn bad sm" data-caball="${i}">Svuota tutto</button></div>
      <p class="mut" style="margin:6px 0 0">Scegli la porta e passa col mouse (tieni premuto) o col dito sui moduli nell'ordine dei cavi. Tocca di nuovo un modulo per toglierlo.</p></div>`:''}
      ${s.cabMode==='man'?'':`<div><label>Partenza</label><select data-sf="cabStart">${[['BL','In basso a sinistra'],['BR','In basso a destra'],['TL','In alto a sinistra'],['TR','In alto a destra']].map(([v,l])=>`<option value="${v}" ${(s.cabStart||'BL')===v?'selected':''}>${l}</option>`).join('')}</select></div>
      <div><label>Direzione</label><select data-sf="cabDir"><option value="col" ${(s.cabDir||'col')==='col'?'selected':''}>Per colonne ↕</option><option value="row" ${s.cabDir==='row'?'selected':''}>Per file ↔</option></select></div>`}

      <div style="grid-column:1/-1" class="mut">${cp.troppi.length?`<span class="bad">⚠️ Troppi moduli su ${cp.troppi.map(n=>'P'+n).join(', ')} (max ${cp.mpp})</span> · `:''}${s.cabMode==='man'&&cp.liberi?`<span class="bad">${cp.liberi} moduli senza cavo</span> · `:''}🔌 <b>${cp.ports}</b> porte dati (max ${cp.mpp} moduli per porta)</div>`})():''}</div></div>`;
    } else h+=`<p class="bad">Aggiungi prima un tipo di cassa LED nell'inventario.</p>`;
    C+=h+`</div>`}

  // ===== DESTRA: materiale necessario e checklist =====
  const n=needs(ev);
  const keys=Object.keys(n).sort((a,b)=>Object.keys(CATS).indexOf(item(a)?.cat)-Object.keys(CATS).indexOf(item(b)?.cat));
  const W=(ev.screens||[]).map(screenCalc).filter(Boolean).reduce((a,c)=>a+c.watt,0);
  const RTOP=W?`<div class="card"><h2 style="margin:0 0 6px">⚡ Consumo totale</h2><div class="kpi" style="grid-template-columns:1fr"><div><b>${(W/1000).toFixed(1)} kW</b><span>tutti gli schermi al massimo · ~${Math.ceil(W/(Math.sqrt(3)*400))} A per fase in trifase · ${psa(W)} distributor${psa(W)>1?'i':'e'}</span></div></div></div>`:'';
  let R=`<div class="card"><h2>📦 Materiale necessario</h2>`;
  keys.forEach(id=>{const it=item(id); if(!it)return; const x=n[id]; const other=usedElsewhere(ev,id); const avail=it.qty-other;
    R+=`<div class="mat"><div style="flex:1;min-width:0"><b>${x.qty}</b> ${it.cat==='led'?'casse':'×'} ${esc(it.name)}<div class="mut">${x.why.map(esc).join(' · ')}</div><div class="mut">Disponibili ${avail}${other?` (${other} in altri eventi)`:''}</div></div>${x.qty<=avail?'<span class="tag ok">OK</span>':`<span class="tag bad">Mancano ${x.qty-avail}</span>`}</div>`});
  if(!keys.length)R+=`<p class="mut">Crea uno schermo per vedere il calcolo.</p>`;
  if((ev.extras||[]).length)R+=`<div style="margin-top:8px">${ev.extras.map((x,k)=>`<span class="tag">${esc(item(x.itemId)?.name)} × ${x.qty} <a href="#" class="noprint" data-act="delExtra" data-i="${k}" style="color:var(--bad)">✕</a></span> `).join('')}</div>`;
  R+=`</div>`;
  const fatti=keys.filter(id=>ev.checked?.[id]).length;
  R+=`<div class="card"><div class="row"><h2 style="margin:0">✅ Checklist carico</h2><span class="sp"></span><span class="tag ${fatti===keys.length&&fatti?'ok':''}">${fatti}/${keys.length}</span></div>
    ${keys.map(id=>{const it=item(id);if(!it)return'';const done=ev.checked?.[id];return `<div class="task${done?' fatto':''}"><input type="checkbox" data-chk="${id}" ${done?'checked':''}><div class="tt" style="flex:1"><b>${n[id].qty}</b> ${it.cat==='led'?'casse':'×'} ${esc(it.name)}</div></div>`}).join('')||'<p class="mut">Niente da caricare.</p>'}</div>`;

  // la chiesa ha tutto il materiale già montato: non si conta l'inventario
  if(ev.id==='chiesa')R=`<div class="card"><h2>📦 Materiale</h2><p class="mut" style="margin:0">Il ledwall della chiesa ha già tutto il suo materiale montato: qui non si conta niente dall'inventario.</p></div>`;
  return h+`<div class="evl">${topL}${L}</div><div class="evc">${C}</div><div class="evr">${topR}${RTOP}<div class="evrs">${R}</div></div></div>`;
}

/* ---------- Calendario ---------- */
/* ---------- Turni domenica ---------- */
function nextSunday(){const d=new Date();d.setDate(d.getDate()+((7-d.getDay())%7));return d.toISOString().slice(0,10)}
function turni(){if(!DB.turni)DB.turni={start:nextSunday(),persone:['Sebi','Lucas','Matteo','Edo'],jolly:'Benni',slot:['Mattina','Sera'],override:{}};DB.turni.override=DB.turni.override||{};return DB.turni}
function isSunday(ds){return new Date(ds+'T12:00').getDay()===0}
// Una persona per domenica (copre mattina e sera), ma mattina (slot 0) e sera (slot 1) si possono cambiare singolarmente.
// Override: 'YYYY-MM-DD:0' / 'YYYY-MM-DD:1' per singolo turno, 'YYYY-MM-DD' per tutta la giornata.
function turno(ds,slot){const T=turni();if(slot!==undefined){const os=T.override[ds+':'+slot];if(os!==undefined)return os}const o=T.override[ds];if(o!==undefined)return o;
  const P=T.persone.filter(Boolean);if(!P.length||!T.start||ds<T.start)return '';
  const w=Math.round((new Date(ds+'T12:00')-new Date(T.start+'T12:00'))/(7*864e5));if(w<0)return '';
  // se chi tocca è assente: il prossimo libero in lista; il jolly solo se nessuno è libero
  for(let k=0;k<P.length;k++){const n=P[(w+k)%P.length];if(!bloccato(n,ds))return n}
  return bloccato(T.jolly,ds)?'':(T.jolly||'')}
// persona della rotazione senza sostituzioni (per sapere chi è stato sostituito)
function turnoBase(ds){const T=turni(),P=T.persone.filter(Boolean);if(!P.length||!T.start||ds<T.start)return '';const w=Math.round((new Date(ds+'T12:00')-new Date(T.start+'T12:00'))/(7*864e5));return w<0?'':P[w%P.length]}
function first(n){return String(n||'').trim().split(/\s+/)[0]}
function isMe(n){return USER&&n&&first(n).toLowerCase()===first(myName()).toLowerCase()}
function sundays(k){const out=[];const d=new Date(nextSunday()+'T12:00');for(let i=0;i<k;i++){out.push(d.toISOString().slice(0,10));d.setDate(d.getDate()+7)}return out}
function vTurni(){
  const T=turni(), opts=[...T.persone,T.jolly].filter(Boolean);
  const sel=(ds,sl)=>{const cur=turno(ds,sl), ov=T.override[ds+':'+sl]!==undefined;
    return `<select data-turno="${ds}:${sl}" style="${isMe(cur)?'border-color:var(--ok);':''}${ov?'font-style:italic;border-color:var(--warn)':''}"><option value="__auto" ${!ov?'selected':''}>Auto</option>${opts.map(o=>`<option value="${esc(o)}" ${ov&&cur===o?'selected':''}>${esc(o)}${bloccato(o,ds)?' 🚫':''}</option>`).join('')}<option value="" ${ov&&cur===''?'selected':''}>Nessuno</option></select>${cur&&bloccato(cur,ds)?`<div class="bad" style="font-size:12px;margin-top:3px">🚫 ${esc(cur)} non c'è</div>`:''}${!ov&&cur&&turnoBase(ds)&&cur!==turnoBase(ds)?`<div class="warn" style="font-size:12px;margin-top:3px">🔁 ${esc(cur)} al posto di ${esc(turnoBase(ds))}</div>`:''}`};
  return `<div class="card"><div class="row"><h2 style="margin:0">⛪ Turni della domenica</h2><span class="sp"></span><button class="btn sec sm" data-act="toggleTset">⚙️ Impostazioni</button></div>
  <p class="mut">Di base una persona per domenica (${esc(T.slot[0].toLowerCase())} e ${esc(T.slot[1].toLowerCase())}), a rotazione tra ${T.persone.length} persone. ${esc(T.jolly)} è il jolly. Se qualcuno non c'è, cambia solo la mattina o solo la sera scegliendo un altro nome; "Auto" torna alla rotazione. I cambi sono evidenziati in arancione.</p>
  ${window.TSET?`<div class="screen grid">
    <div style="grid-column:span 2"><label>Persone in rotazione (una per riga, in ordine)</label><textarea data-tset="persone" rows="5">${esc(T.persone.join('\n'))}</textarea></div>
    <div><label>Jolly</label><input data-tset="jolly" value="${esc(T.jolly)}"></div>
    <div><label>Prima domenica della rotazione</label><input type="date" data-tset="start" value="${T.start}"></div>
    </div>`:''}
  <table><tr><th>Domenica</th><th>☀️ ${esc(T.slot[0])}</th><th>🌙 ${esc(T.slot[1])}</th></tr>
  ${sundays(window.TMORE?26:10).map(ds=>`<tr><td>${fmtD(ds)}</td><td>${sel(ds,0)}</td><td>${sel(ds,1)}</td></tr>`).join('')}</table>
  ${window.TMORE?'':'<button class="btn sec sm" data-act="moreTurni" style="margin-top:10px">Mostra altre domeniche</button>'}</div>`;
}
function autoTurno(ds,sl){const T=turni();const k=ds+':'+sl;const o=T.override[k];delete T.override[k];const r=turno(ds,sl);if(o!==undefined)T.override[k]=o;return r}
const PAL=['#e5484d','#4f8cff','#2fbf71','#f0a020','#a855f7','#14b8a6','#ec4899','#84cc16'];
function pcol(n){const T=turni();const L=[...T.persone,T.jolly].filter(Boolean).map(first);const i=L.indexOf(first(n));return i>=0?PAL[i%PAL.length]:colorOf(n)}
function dav(n,sl,ds){const T=turni(), b=ds&&bloccato(n,ds);return `<span class="dav${isMe(n)?' me':''}${b?' blk':''}" style="background:${pcol(n)}" title="${esc((sl===null?'Di turno':T.slot[sl])+': '+n+(b?' (non c\'è)':''))}">${esc(initials(n))}${sl===null?'':`<i>${sl?'🌙':'☀️'}</i>`}</span>`}
function davDay(ds){const m=turno(ds,0),e=turno(ds,1);if(!m&&!e)return '';return `<div>${m===e?dav(m,null,ds):(m?dav(m,0,ds):'')+(e?dav(e,1,ds):'')}</div>`}

/* ---------- Pixelmap animata (loop con radar) ---------- */

// cablaggio a serpentina: ordine dei moduli, porte dati (pixel max per porta) e linee di corrente (ampere)
function cabPlan(c,s){

  {const f=order.filter(([k,r])=>!c.off.has(k+','+r));order.length=0;order.push(...f)}

  return {order,chains,mpp,mpu,mpd,ports:chains.length,dist:Math.max(1,Math.ceil(all.length/mpd)),pos,A,liberi:c.mods-all.length,troppi:chains.map((ch,i)=>ch.length>mpp?i+1:0).filter(Boolean)};
}
// Rileva il profilo e il rettangolo pieno piu ampio ad ogni disegno.

const pmClamp=(v,a,b)=>Math.max(a,Math.min(b,v));

  const W=c.pxW,H=c.pxH,minW=Math.min(W,Math.max(16,W*.05)),minH=Math.min(H,Math.max(16,H*.12));

}

        stamp(it);DB.items.unshift(it);logChange(`Aggiunto articolo in ${CATS[cat]}`)},
      async delItem(){const it=item(a.dataset.id);if(await ask('Eliminare questo articolo?')){DB.items=DB.items.filter(i=>i.id!==a.dataset.id);logChange(`Eliminato articolo "${it&&it.name}"`)}else return 'nosave'},
      chiesa(){if(!chiesaOwner()){view='chiesa';curEv=null;rememberUI();return 'nosave'}let c=DB.events.find(x=>x.id==='chiesa');let l=DB.items.find(i=>i.cat==='led'&&+i.pxW===192&&+i.pxH===384);
        if(!l){l={id:uid(),cat:'led',name:'Moduli P2.6 (chiesa)',qty:118,modPerCase:6,modW:500,modH:1000,pxW:192,pxH:384,kg:13,watt:200,autoPer:'none',autoQty:0,note:'Ledwall fisso della chiesa. Peso e consumo stimati: da controllare.'};stamp(l);DB.items.push(l);logChange('Aggiunto in inventario: Moduli P2.6 (chiesa)')}
        if(c&&c.screens[0]){const s0=c.screens[0],cur=item(s0.ledId);if(!cur||+cur.pxW!==192||+cur.pxH!==384){s0.ledId=l.id;stamp(c)}}
        if(!c){const off=[];for(let k=0;k<52;k++)if(k<16||k>29)off.push(k+',2');
        c={id:'chiesa',name:'⛪ Ledwall chiesa',place:'Chiesa',start:'',end:'',screens:[{name:'LEDWALL',ledId:l?.id,mode:'moduli',w:52,h:3,off,cabOn:'3'}],extras:[],checked:{}};stamp(c);DB.events.push(c);logChange('Creata la configurazione della chiesa')}
        curEv='chiesa';window.SCROPEN=0;window.SCREV='chiesa';rememberUI()},
      addEv(){const t=new Date().toISOString().slice(0,10);const n={id:uid(),name:'Nuovo evento',place:'',start:t,end:'',screens:[],extras:[],checked:{}};stamp(n);DB.events.push(n);curEv=n.id;window.EVDATI=n.id;logChange('Creato un nuovo evento')},
      back(){const church=curEv==='chiesa';curEv=null;view=church?'calendario':'eventi';rememberUI();render();return 'nosave'},
      async delEv(){if(await ask('Eliminare l\'evento?')){logChange(`Eliminato evento "${ev.name}"`);DB.events=DB.events.filter(x=>x.id!==curEv);curEv=null}else return 'nosave'},
      dupEv(){const c=JSON.parse(JSON.stringify(ev));c.id=uid();c.name+=' (copia)';c.checked={};stamp(c);DB.events.push(c);curEv=c.id;logChange(`Duplicato evento "${ev.name}"`)},
      addScreen(){const l=DB.items.find(i=>i.cat==='led');ev.screens.unshift({name:'Schermo '+(ev.screens.length+1),ledId:l?.id,mode:'moduli',w:3,h:2});window.SCROPEN=0;window.SCREDIT=true;stamp(ev);logChange(`Evento "${ev.name}": aggiunto schermo`)},
      delScreen(){const sc=ev.screens[+a.dataset.i];ev.screens.splice(+a.dataset.i,1);window.SCROPEN=-1;stamp(ev);logChange(`Evento "${ev.name}": rimosso ${sc&&sc.name}`)},
      addExtra(){ev.extras=ev.extras||[];const x={itemId:document.getElementById('extraSel').value,qty:+document.getElementById('extraQty').value||1};ev.extras.push(x);stamp(ev);logChange(`Evento "${ev.name}": aggiunto a mano ${x.qty} × ${item(x.itemId)?.name}`)},
      delExtra(){const x=ev.extras[+a.dataset.i];ev.extras.splice(+a.dataset.i,1);stamp(ev);logChange(`Evento "${ev.name}": tolto ${x&&item(x.itemId)?.name}`)},
      async export(){const data=JSON.stringify(DB,null,2), filename='backup-gestionale-'+new Date().toISOString().slice(0,10)+'.json';
        let dl=null; try{if(window.claude&&window.claude.use)dl=await window.claude.use('downloads')}catch(_){}
        if(dl){try{await dl.save({filename,data});toast('Backup salvato')}catch(_){toast('Download annullato')}}
        else{const b=new Blob([data],{type:'application/json'});const u=document.createElement('a');u.href=URL.createObjectURL(b);u.download=filename;u.click()}
        return 'nosave'},
      copyIcs(){copia(FEED_BASE+'?t='+FEEDTOK+(isAdmin()?'':'&solo=turni')+(isMe(turni().jolly)?'':'&p='+encodeURIComponent(first(myName()))),'Link calendario copiato');return 'nosave'},
      copyScript(){copia(scriptable(),'Script copiato: ora aprilo in Scriptable');return 'nosave'},
      moreTurni(){window.TMORE=true;render();return 'nosave'},
      toggleTset(){window.TSET=!window.TSET;render();return 'nosave'},
      async reset(){if(await ask('Cancellare tutto e ripristinare i dati di esempio? Vale per tutti gli utenti.')){DB=seed();logChange('Ripristinati i dati di esempio (tutto cancellato)')}else return 'nosave'},
    };
    if(A[act]){ if(act==='delExtra')e.preventDefault(); const r=await A[act](); if(r!=='nosave'){save();render()} }
  };
  app.onchange=e=>{
    const t=e.target, ev=curEv&&DB.events.find(x=>x.id===curEv);
    if(t.id==='logq'){window.LOGQUERY=t.value;render();return}
    if(t.dataset.turno){const T=turni();const [ds,sl]=t.dataset.turno.split(':');const k=ds+':'+sl;const old=turno(ds,+sl);
      if(t.value==='__auto')delete T.override[k];else T.override[k]=t.value;
      logChange(`Turno ${T.slot[+sl]} di ${fmtD(ds)}: ${old||'nessuno'} → ${turno(ds,+sl)||'nessuno'}`);save();render();return}
    if(t.dataset.tset){const T=turni();const f=t.dataset.tset;
      if(f==='persone')T.persone=t.value.split('\n').map(x=>x.trim()).filter(Boolean);
      else if(f==='slot0')T.slot[0]=t.value;else if(f==='slot1')T.slot[1]=t.value;else T[f]=t.value;
      logChange(`Turni: modificate le impostazioni (${t.parentElement.querySelector('label').textContent})`);save();render();return}
    const lab=()=>{const l=t.parentElement&&t.parentElement.querySelector('label');return l?l.textContent:''};
    const show=(f,v)=>{if(f==='ledId')return item(v)?.name||v;if(f==='autoPer')return PER[v]||v;return v===''||v==null?'(vuoto)':v};
    if(t.id==='imp'){const f=t.files[0];if(!f)return;f.text().then(s=>{try{const d=JSON.parse(s);if(!d.items)throw 0;DB=d;logChange('Importato un backup (sostituiti tutti i dati)');save();toast('Backup importato');render()}catch(_){toast('File non valido')}});return}
    if(t.id==='scorta'){const old=DB.settings.scorta;DB.settings.scorta=+t.value||0;logChange(`Scorta moduli: ${old}% → ${DB.settings.scorta}%`)}
    else if(t.dataset.f){const it=item(t.closest('[data-item]').dataset.item); const old=it[t.dataset.f]; it[t.dataset.f]=t.type==='number'?+t.value:t.value; stamp(it);
      logChange(t.dataset.f==='name'?`Inventario: rinominato "${old}" → "${it.name}"`:`Inventario "${it.name}": ${lab()} ${show(t.dataset.f,old)} → ${show(t.dataset.f,it[t.dataset.f])}`)}
    else if(t.dataset.ef){const old=ev[t.dataset.ef]; ev[t.dataset.ef]=t.value; if(t.dataset.ef==='end'&&t.value&&t.value<ev.start){ev.end=ev.start} stamp(ev);
      logChange(t.dataset.ef==='name'?`Evento rinominato "${old}" → "${ev.name}"`:t.dataset.ef==='notes'?`Evento "${ev.name}": modificate le note`:`Evento "${ev.name}": ${lab()} ${show('',old)} → ${show('',ev[t.dataset.ef])}`)}
    else if(t.dataset.sf){const s=ev.screens[+t.closest('[data-scr]').dataset.scr]; const old=s[t.dataset.sf]; s[t.dataset.sf]=t.type==='number'?+t.value:t.value; stamp(ev);
      logChange(`Evento "${ev.name}", ${s.name}: ${lab()} ${show(t.dataset.sf,old)} → ${show(t.dataset.sf,s[t.dataset.sf])}`)}
    else if(t.dataset.chk){ev.checked=ev.checked||{};ev.checked[t.dataset.chk]=t.checked; logChange(`Evento "${ev.name}": ${t.checked?'caricato ✓':'tolta la spunta a'} "${item(t.dataset.chk)?.name}"`)}
    else return;
    save(); render();
  };
}
start();
</script>
